<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f6f3f" />
    <title>Snacky OS Offline</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f8fafc;
        --panel: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #cbd5e1;
        --brand: #3f6f3f;
        --brand-hover: #315a31;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--panel);
        padding: 24px;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      }

      .mark {
        width: 56px;
        height: 56px;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: #ffffff;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        object-fit: contain;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      button {
        width: 100%;
        min-height: 48px;
        margin-top: 20px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--brand-hover);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/brand/snacky-logo.png" alt="Snacky logo" />
      <h1>You are offline</h1>
      <p>Snacky OS needs a connection for live routes, inventory, cash collection, and imports. Reconnect and try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
