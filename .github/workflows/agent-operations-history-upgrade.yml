name: Validate operations history upgrade

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-operations-history-upgrade.py"
      - ".github/workflows/agent-operations-history-upgrade.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/operations-history-upgrade
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply operations history patch
        run: python scripts/agent-operations-history-upgrade.py
      - name: Install dependencies
        run: npm ci
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Test route pickup regression
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/operations-history-upgrade
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/routes/[id]/page.tsx",
              "src/app/routes/page.tsx",
              "src/app/machines/page.tsx",
              "src/app/machines/[id]/page.tsx",
              "src/app/team/page.tsx",
              "src/app/team/[id]/page.tsx",
              "scripts/test-critical-workflows.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(url, data=data, method=method, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              })
              with urlopen(req) as response:
                  return json.load(response)

          for path in files:
              sha = None
              try:
                  sha = request_json(f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}").get("sha")
              except HTTPError as error:
                  if error.code != 404:
                      raise
              payload = {
                  "message": "Add route outcome and operations history pages",
                  "content": base64.b64encode(Path(path).read_bytes()).decode(),
                  "branch": branch,
              }
              if sha:
                  payload["sha"] = sha
              request_json(f"https://api.github.com/repos/{repo}/contents/{path}", method="PUT", payload=payload)
          PY
