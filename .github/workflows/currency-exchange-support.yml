name: Currency exchange and customer support
on:
  pull_request:
    paths:
      - 'src/lib/business-record-*.ts'
      - 'src/lib/finance-balance.ts'
      - 'src/lib/finance-ledger.ts'
      - 'src/components/BusinessRecordForm.tsx'
      - 'src/components/module-tabs-config.ts'
      - 'src/app/finance/exchange/**'
      - 'src/app/issues/**'
      - 'supabase/migrations/*currency_exchange*'
      - 'supabase/migrations/*customer_issue*'
      - 'scripts/test-currency-exchange-support*'
      - '.github/workflows/currency-exchange-support.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fx-support-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: snacky_fx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Native PostgreSQL migrations and exchange/support commands (isolated fixtures)
        env:
          PGPASSWORD: isolated_ci_only
        run: psql -h localhost -U postgres -d snacky_fx_test -v ON_ERROR_STOP=1 -f scripts/test-currency-exchange-support-db.sql
      - name: Exchange projections, support entry, actual form events, and server-action boundaries
        run: node --experimental-strip-types --test scripts/test-currency-exchange-support.mjs scripts/test-currency-exchange-support-forms.mjs
      - name: Finance and role regressions
        run: node --experimental-strip-types --test scripts/test-finance-import.mjs scripts/test-finance-operations-dashboard.mjs scripts/test-authz-permissions.mjs scripts/test-finance-ledger-visibility.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build and core ledger regressions
        run: npm run build
