name: Buying store migration scaffold
on:
  push:
    branches: ['feat/buying-store-guidance-v1']
    paths: ['.github/workflows/buying-store-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/buying-store-guidance-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration identity only, without any database connection
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help
          supabase migration new buying_store_guidance_v1
          rm .github/workflows/buying-store-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*buying_store_guidance_v1.sql .github/workflows/buying-store-scaffold.yml
          git commit -m 'chore(buying): add CLI-generated store-guidance migration scaffold'
          git push origin HEAD:refs/heads/feat/buying-store-guidance-v1
