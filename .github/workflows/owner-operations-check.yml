name: Owner Operations release checks
on:
  push:
    branches: ['feat/owner-operations-overview-v1']
    paths-ignore: ['docs/**']
  pull_request:
    paths:
      - 'src/lib/owner-operations*'
      - 'src/components/OwnerOperationsOverview.tsx'
      - 'src/app/admin/operations/**'
      - 'src/app/api/owner-operations/**'
      - 'src/app/admin/page.tsx'
      - 'src/components/StorageStocktakeWorkspace.tsx'
      - 'src/app/inventory/stocktake/page.tsx'
      - 'supabase/migrations/*owner_operations_overview*'
      - 'scripts/*owner-operations*'
      - '.github/workflows/owner-operations-check.yml'
permissions:
  contents: read
concurrency:
  group: owner-operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: owner_operations_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/owner_operations_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit, partial failure and existing access regressions
        run: |
          node --experimental-strip-types --test scripts/test-owner-operations.mjs scripts/test-authz-permissions.mjs
          node --test scripts/test-assigned-storage-stocktake.mjs scripts/test-crm-operator-dispatch.mjs
      - name: TypeScript and focused lint
        run: |
          npm run typecheck
          npx eslint src/lib/owner-operations.ts src/lib/owner-operations-server.ts src/app/api/owner-operations/route.ts src/app/admin/operations/page.tsx src/components/OwnerOperationsOverview.tsx src/app/admin/page.tsx src/app/inventory/stocktake/page.tsx src/components/StorageStocktakeWorkspace.tsx
      - name: Database permissions, no writes, scopes and paging
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/owner-operations-db.sql
      - name: Prepare actual component browser fixture
        run: |
          python3 -m venv .qa/owner-browser
          .qa/owner-browser/bin/pip install playwright==1.55.0
          .qa/owner-browser/bin/playwright install --with-deps chromium
          mkdir -p src/app/login/qa-owner-operations diagnostics/owner-operations
          cp scripts/owner-operations-fixture.tsx src/app/login/qa-owner-operations/page.tsx
          node scripts/next-build.mjs
      - name: English and Arabic phone layouts and failure recovery
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > diagnostics/owner-operations/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; rm -rf src/app/login/qa-owner-operations' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login/qa-owner-operations >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat diagnostics/owner-operations/server.log; exit 1; fi
            sleep 0.5
          done
          .qa/owner-browser/bin/python scripts/owner-operations-browser.py
          kill "$server_pid" >/dev/null 2>&1 || true
          rm -rf src/app/login/qa-owner-operations .next
          trap - EXIT
      - name: Existing critical workflow safety
        run: npm run test:critical-workflows
      - name: Production build with no fixture route
        run: |
          test ! -e src/app/login/qa-owner-operations
          npm run build
      - name: Store review evidence
        if: always()
        run: |
          mkdir -p diagnostics/owner-operations
          git rev-parse HEAD > diagnostics/owner-operations/commit.txt
          tar -czf diagnostics/owner-operations/review-source.tar.gz src scripts supabase docs .github package.json package-lock.json tsconfig.json next.config.ts eslint.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-operations-review
          path: diagnostics/owner-operations/**
