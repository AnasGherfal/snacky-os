name: Integrate reviewed personal work navigation
on:
  push:
    branches: ['feat/personal-work-today-v1']
    paths: ['.github/workflows/personal-work-integrate.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-work-today-v1
      - name: Verify and apply only three reviewed shared-file changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'src/lib/authz.ts':'c227919ba33898c034b5bcb0ef6928b5fc515814a7b28943a85870b18cd5fe2e',
            'src/components/Sidebar.tsx':'4bf5456acd135842c7818e2c6d1194cdbcd27c36d8f6faf87a90837bd8d24927',
            'src/components/Topbar.tsx':'9416ffd8c09ec7d06344bc31767f407a78cd5574a401d6c3e98e1ebc374a4ec5'
          }
          for path,digest in expected.items():
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
          git apply --check scripts/.personal-work-integration.patch
          git apply scripts/.personal-work-integration.patch
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'src/lib/authz.ts':'380c95135b2716ac4a47609142b4bad9fd2e47a40677f1c9d92ba18aa200cf2f',
            'src/components/Sidebar.tsx':'c6709bbe3408dbd77ff422f6c85cebd7c2255965d120ccb311f1884cd96ad26c',
            'src/components/Topbar.tsx':'fe05219b1102381bed11a4e95c162c2fcdc2ac72284cdf8d43298156923ecff9'
          }
          for path,digest in expected.items():
            assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==digest,path
          PY
          rm scripts/.personal-work-integration.patch .github/workflows/personal-work-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/authz.ts src/components/Sidebar.tsx src/components/Topbar.tsx scripts/.personal-work-integration.patch .github/workflows/personal-work-integrate.yml
          git commit -m 'feat(my-day): link personal work without changing workflow permissions'
          git push origin HEAD:refs/heads/feat/personal-work-today-v1
