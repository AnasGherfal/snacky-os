name: Smart Work Part 3B - atomic Start Trip
# controlled-pilot-verification
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/smart-work-start-trip.yml'
      - 'supabase/feature-sql/smart_work_start_trip.sql'
      - 'supabase/feature-sql/smart_work_dispatch_pilot_scope.sql'
      - 'supabase/feature-sql/smart_work_dispatch_pilot_scope.sql'
      - 'supabase/feature-sql/smart_work_partial_refill_lifecycle.sql'
      - 'supabase/migrations/*_smart_work_dispatch_pilot_scope.sql'
      - 'supabase/migrations/*_smart_work_partial_refill_lifecycle.sql'
      - 'scripts/test-smart-work-pilot-scope.sql'
      - 'scripts/test-smart-work-partial-refill-lifecycle.sql'
      - 'src/lib/smart-work-start-trip*'
      - 'src/app/api/operator/start-trip/**'
      - 'src/app/operator/product-plan/**'
      - 'scripts/*smart-work-start-trip*'
      - 'scripts/test-smart-work-pilot-scope.sql'
      - 'docs/smart-work-part3b-start-trip.md'
permissions:
  contents: read
concurrency:
  group: smart-work-start-trip-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_trip_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: smart_trip_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate canonical pilot migrations
        run: |
          set -euo pipefail
          if ! ls supabase/migrations/*_smart_work_dispatch_pilot_scope.sql >/dev/null 2>&1; then
            supabase migration new smart_work_dispatch_pilot_scope
            file="$(find supabase/migrations -name '*_smart_work_dispatch_pilot_scope.sql' | head -1)"
            cp supabase/feature-sql/smart_work_dispatch_pilot_scope.sql "$file"
          fi
          if ! ls supabase/migrations/*_smart_work_partial_refill_lifecycle.sql >/dev/null 2>&1; then
            supabase migration new smart_work_partial_refill_lifecycle
            file2="$(find supabase/migrations -name '*_smart_work_partial_refill_lifecycle.sql' | head -1)"
            cp supabase/feature-sql/smart_work_partial_refill_lifecycle.sql "$file2"
          fi
          file="$(find supabase/migrations -name '*_smart_work_dispatch_pilot_scope.sql' | head -1)"
          file2="$(find supabase/migrations -name '*_smart_work_partial_refill_lifecycle.sql' | head -1)"
          cmp supabase/feature-sql/smart_work_dispatch_pilot_scope.sql "$file"
          cmp supabase/feature-sql/smart_work_partial_refill_lifecycle.sql "$file2"
          echo "MIGRATION_FILE=$file" >> "$GITHUB_ENV"
          echo "LIFECYCLE_MIGRATION_FILE=$file2" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: smart-work-pilot-migration
          path: |
            supabase/migrations/*_smart_work_dispatch_pilot_scope.sql
            supabase/migrations/*_smart_work_partial_refill_lifecycle.sql
          retention-days: 3
      - name: Isolated schema and transaction tests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/smart-work-start-trip-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/smart-work-start-trip-source-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_start_trip.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_start_trip.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-start-trip.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-pilot-scope.sql
      - name: Controlled pilot and shortage-safe partial tests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_day_availability_start_trip.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-pilot-scope.sql
      - name: Concurrent requests and mixed legacy writes
        run: bash scripts/test-smart-work-start-trip-race.sh
      - name: Verified partial refill keeps duty alive until healthy
        run: |
          set -euo pipefail
          dropdb --if-exists --maintenance-db=postgres smart_trip_test
          psql -d postgres -v ON_ERROR_STOP=1 -c "drop role if exists anon, authenticated, service_role"
          dropdb --if-exists --maintenance-db=postgres partial_lifecycle_test
          createdb --maintenance-db=postgres partial_lifecycle_test
          PGDATABASE=partial_lifecycle_test psql -v ON_ERROR_STOP=1 -f scripts/smart-work-duty-fixture.sql
          PGDATABASE=partial_lifecycle_test psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_coverage_setup.sql
          PGDATABASE=partial_lifecycle_test psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_daily_duties.sql
          PGDATABASE=partial_lifecycle_test psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_partial_refill_lifecycle.sql
          PGDATABASE=partial_lifecycle_test psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-partial-refill-lifecycle.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Trip and product API regression tests
        run: node --experimental-strip-types --experimental-vm-modules --test scripts/test-smart-work-product-plan.mjs scripts/test-smart-work-products-api.mjs scripts/test-smart-work-start-trip-api.mjs
      - name: Full application type check
        run: npx tsc --noEmit
      - name: Collect source for independent local verification
        if: always() && hashFiles('package.json') != ''
        run: tar -czf /tmp/start-trip-verification-source.tar.gz src scripts supabase package.json package-lock.json tsconfig.json next-env.d.ts next.config.ts postcss.config.mjs
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('package.json') != ''
        with:
          name: start-trip-verification-source
          path: /tmp/start-trip-verification-source.tar.gz
          retention-days: 2
