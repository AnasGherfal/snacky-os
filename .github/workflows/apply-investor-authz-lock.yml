name: Apply investor VMS access lock

on:
  push:
    branches:
      - feature/growth-decisions-investor-portal
    paths:
      - ".github/workflows/apply-investor-authz-lock.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/growth-decisions-investor-portal
          fetch-depth: 0
      - name: Lock direct VMS URLs to VMS permissions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/authz.ts')
          source = path.read_text(encoding='utf-8')
          old = '  if (matchesPrefix(pathname, ["/vms-import", "/vms-mappings"])) return true;'
          new = '  if (matchesPrefix(pathname, ["/vms-import"])) return canViewVmsImports(user);\n  if (matchesPrefix(pathname, ["/vms-mappings"])) return canManageVmsMappings(user);'
          if old not in source:
              raise SystemExit('Expected VMS access shortcut was not found.')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit guarded authorization fix
        run: |
          git config user.name "Snacky CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/authz.ts
          git commit -m "Restrict direct VMS URLs by permission"
          git push origin HEAD:feature/growth-decisions-investor-portal
