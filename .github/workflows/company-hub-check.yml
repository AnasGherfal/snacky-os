name: Company Hub checks
on:
  pull_request:
    paths:
      - '.github/workflows/company-hub-check.yml'
      - 'src/**/company/**'
      - 'src/lib/company-*'
      - 'src/components/Company*'
      - 'src/components/NotificationCenter.tsx'
      - 'src/components/Topbar.tsx'
      - 'src/components/Sidebar.tsx'
      - 'src/components/app-navigation.ts'
      - 'src/components/module-tabs-config.ts'
      - 'src/components/CrmWorkspace.tsx'
      - 'src/lib/authz.ts'
      - 'supabase/migrations/*company_hub*'
      - 'scripts/test-company-hub*'
permissions:
  contents: read
concurrency:
  group: company-hub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-company-only
          POSTGRES_DB: crm_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration with the Supabase CLI when preparing this feature
        run: |
          mkdir -p diagnostics
          if ! find supabase/migrations -name '*_company_hub.sql' -print -quit | grep -q .; then
            supabase migration new --help
            supabase migration new company_hub
            find supabase/migrations -name '*_company_hub.sql' -exec cp {} diagnostics/ \;
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: company-generated-migration
          path: diagnostics/*_company_hub.sql
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Company contracts and real client handler tests
        run: |
          if test -f scripts/test-company-hub.mjs; then
            node --experimental-strip-types --test scripts/test-company-hub.mjs
          fi
      - name: Actual isolated migrations, access controls and no-money effects
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: isolated-company-only
          PGDATABASE: crm_tests
        run: |
          if test -f scripts/test-company-hub-db.sql; then
            psql -X -v ON_ERROR_STOP=1 -f scripts/test-company-hub-db.sql > diagnostics/database.log 2>&1 || { tail -n 100 diagnostics/database.log; exit 1; }
            tail -n 35 diagnostics/database.log
          fi
      - name: Existing permissions and customer-relations regression tests
        run: node --experimental-strip-types --test scripts/test-authz-permissions.mjs scripts/test-connected-relations.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Production build, including core ledger checks
        run: |
          npm run build > diagnostics/build.log 2>&1 || { tail -n 100 diagnostics/build.log; exit 1; }
          tail -n 35 diagnostics/build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-test-diagnostics
          path: diagnostics/*.log
          if-no-files-found: ignore
          retention-days: 2
