name: Diagnose stop-only route workflow test

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-route-stop-planning.py"
      - ".github/workflows/agent-route-stop-planning-test-diagnostic.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-stop-planning
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent-route-stop-planning.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          old = old.replace("              count", "    count").replace("              if", "    if").replace("                  raise", "        raise").replace("              return", "    return")
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "sticky summary mode" and count == 0:
                  pattern = r"(?m)^(\\s*)\\{selectedProducts\\.length\\} items selected · \\{plannedRouteStock\\.reduce\\(\\(sum, item\\) => sum \\+ unitQuantity\\(item\\.quantity\\), 0\\)\\} total units\\s*$"
                  match = re.search(pattern, text)
                  if match:
                      return text[:match.start()] + f"{match.group(1)}{new.strip()}" + text[match.end():]
              if label == "API activity creation mode" and count == 0:
                  pattern = r"(?m)^(\\s*)assignment_mode: assignmentMode,\\s*$"
                  match = re.search(pattern, text)
                  if match:
                      indent = match.group(1)
                      replacement = f"{indent}assignment_mode: assignmentMode,\\n{indent}creation_mode: creationMode,\\n{indent}products_deferred_until_storage: stopsOnly,"
                      return text[:match.start()] + replacement + text[match.end():]
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = new.replace("              count", "    count").replace("              if label", "    if label").replace("                  pattern", "        pattern").replace("                  match", "        match").replace("                  if match", "        if match").replace("                      return", "            return").replace("                      indent", "            indent").replace("                      replacement", "            replacement").replace("              if count", "    if count").replace("                  raise", "        raise").replace("              return", "    return")
          if text.count(old) != 1: raise SystemExit("Patch helper not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply patch
        run: python scripts/agent-route-stop-planning.py
      - name: Install dependencies
        run: npm ci
      - name: Run route workflow test
        id: route_test
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:route-workflow 2>&1 | tee /tmp/route-workflow-test.log
      - name: Publish route workflow test output
        if: steps.route_test.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/route-stop-planning
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          path = "scripts/agent-route-workflow-test-error.txt"
          content = base64.b64encode(Path("/tmp/route-workflow-test.log").read_bytes()).decode()
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(request) as response: return json.load(response)
          sha = None
          try: sha = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}").get("sha")
          except HTTPError as error:
              if error.code != 404: raise
          payload = {"message": "Record route workflow test diagnostic", "content": content, "branch": branch}
          if sha: payload["sha"] = sha
          request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload=payload)
          PY
      - name: Stop on route test failure
        if: steps.route_test.outcome == 'failure'
        run: exit 1
