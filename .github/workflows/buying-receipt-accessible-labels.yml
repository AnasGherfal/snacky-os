name: Receipt selector accessibility patch
on:
  push:
    branches: [feat/buying-list-purchase-receipt-v1]
    paths: [.github/workflows/buying-receipt-accessible-labels.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/buying-list-purchase-receipt-v1
      - name: Label selectors independently of their option text
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/BuyingPurchaseClient.tsx');s=p.read_text()
          replacements=[
            ('<select className="field-input mt-1 w-full" required value={supplier}', '<select aria-label={ar?\'المتجر الفعلي\':\'Actual store\'} className="field-input mt-1 w-full" required value={supplier}'),
            ('<select required className="field-input mt-1 w-full" value={storage}', '<select aria-label={ar?\'المخزن الفعلي\':\'Actual storage location\'} required className="field-input mt-1 w-full" value={storage}'),
            ('<select className="field-input mt-1 w-full" value={storage}', '<select aria-label={ar?\'أين وضعت المنتجات؟\':\'Where did you place the goods?\'} className="field-input mt-1 w-full" value={storage}')
          ]
          for old,new in replacements:
            assert s.count(old)==1,old
            s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('scripts/test-buying-purchase.mjs');s=p.read_text()
          s+='\n' + '''test('store and storage controls expose distinct accessible names without option text',()=>{
           assert.ok(ui.includes('aria-label={ar?\\\'المتجر الفعلي\\\':\\\'Actual store\\\'}'));
           assert.ok(ui.includes('aria-label={ar?\\\'أين وضعت المنتجات؟\\\':\\\'Where did you place the goods?\\\'}'));
          });
          '''
          p.write_text(s)
          PY
          rm .github/workflows/buying-receipt-accessible-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/BuyingPurchaseClient.tsx scripts/test-buying-purchase.mjs .github/workflows/buying-receipt-accessible-labels.yml
          git diff --cached --check
          git commit -m 'fix(buying): make receipt store controls accessible in English and Arabic'
          git push origin HEAD:refs/heads/feat/buying-list-purchase-receipt-v1
