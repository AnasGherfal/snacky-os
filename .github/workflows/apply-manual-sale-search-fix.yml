name: Apply manual sale search fix

on:
  push:
    branches:
      - agent/fix-stop-carried-quantity

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-stop-carried-quantity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-manual-sale-product-search-fix.mjs
      - run: |
          rm scripts/apply-manual-sale-product-search-fix.mjs
          rm .github/workflows/apply-manual-sale-search-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/operator/ManualRouteSalesSection.tsx scripts/apply-manual-sale-product-search-fix.mjs .github/workflows/apply-manual-sale-search-fix.yml
          git commit -m "Fix manual sale full catalog search"
          git push origin HEAD:agent/fix-stop-carried-quantity
