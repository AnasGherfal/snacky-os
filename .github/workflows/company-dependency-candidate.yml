name: Company dependency remediation candidate
on:
  pull_request:
    paths:
      - '.github/workflows/company-dependency-candidate.yml'
permissions:
  contents: read
concurrency:
  group: company-dependency-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/company-hub'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate exact-version candidate from the reviewed lockfile
        run: |
          mkdir -p diagnostics
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          for (const section of ['dependencies','devDependencies']) {
            for (const name of Object.keys(manifest[section] || {})) {
              const version = lock.packages['node_modules/'+name]?.version;
              if (!version) throw Error('Missing locked version: '+name);
              manifest[section][name] = version;
            }
          }
          manifest.dependencies.next = '16.3.5';
          manifest.devDependencies['eslint-config-next'] = '16.3.5';
          manifest.dependencies.xlsx = 'https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz';
          manifest.overrides = {...manifest.overrides, postcss: '8.5.23', nanoid: '3.3.18', sharp: '0.35.4', 'baseline-browser-mapping': '2.11.0'};
          fs.writeFileSync('package.json',JSON.stringify(manifest,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts
          npm update --package-lock-only --ignore-scripts brace-expansion browserslist js-yaml @babel/core
          cp package.json package-lock.json diagnostics/
          npm view next@16.3.5 version dependencies peerDependencies --json > diagnostics/next-metadata.json
          npm audit --omit=dev --json > diagnostics/candidate-production-audit.json
          npm audit --json > diagnostics/candidate-all-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-dependency-candidate
          path: diagnostics/*.json
          retention-days: 7
      - name: Install candidate using its integrity-locked dependencies
        id: install
        run: npm ci
      - name: Exercise parser and Company unit tests (the monthly XLS script requires a running integration environment)
        run: node --experimental-strip-types --test scripts/test-company-hub.mjs scripts/test-company-release-gate.mjs scripts/test-vms-sales-import-parser.mjs scripts/test-finance-import.mjs scripts/test-vms-import-validation.mjs
      - name: Public dependencies and formatter for offline review
        if: always() && steps.install.outcome == 'success'
        run: |
          npm install --prefix .qa/tools --no-package-lock --ignore-scripts prettier@3.6.2
          tar --exclude='node_modules/@next/swc*' --exclude='node_modules/@img' --exclude='node_modules/.cache' -czf diagnostics/review-libs.tar.gz node_modules .qa/tools/node_modules
      - uses: actions/upload-artifact@v4
        if: always() && steps.install.outcome == 'success'
        with:
          name: company-public-review-libs
          path: diagnostics/review-libs.tar.gz
          retention-days: 2
      - name: Typecheck and build candidate
        env:
          NEXT_PUBLIC_SNACKY_COMPANY_HUB_ENABLED: 'true'
        run: |
          npm run typecheck > diagnostics/typecheck.log 2>&1 || { tail -n 80 diagnostics/typecheck.log; exit 1; }
          npm run build > diagnostics/build.log 2>&1 || { tail -n 80 diagnostics/build.log; exit 1; }
      - name: Commit only tested dependency files to this PR branch (never merge or force-push)
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$HEAD_BRANCH" = 'feat/company-hub'
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git fetch origin "$HEAD_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA"
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- package.json package-lock.json
            git commit -m 'Pin reviewed dependencies and resolve runtime/build dependency advisories'
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
          git rev-parse HEAD > diagnostics/dependency-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-dependency-test-results
          path: |
            diagnostics/*.log
            diagnostics/dependency-commit.txt
          retention-days: 7
