name: Company full-stack integration
on:
  pull_request:
    paths:
      - '.github/workflows/company-full-stack-check.yml'
      - 'scripts/company-e2e/**'
      - 'src/components/Company*'
      - 'src/lib/company-*'
      - 'src/app/api/company/**'
      - 'src/app/company/**'
      - 'supabase/migrations/*company_hub*'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
concurrency:
  group: company-full-stack-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prepare disposable local project (no production data or link)
        run: |
          mkdir -p .qa/full/supabase diagnostics
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/config.toml').read_text()
          text=text.replace('project_id = "snacky-os"','project_id = "snacky-company-isolated"')
          for section in ['db.migrations','db.seed','studio','inbucket','realtime','edge_runtime']:
            start=text.index('['+section+']')
            end=text.find('\n[',start+1)
            if end<0:end=len(text)
            text=text[:start]+text[start:end].replace('enabled = true','enabled = false')+text[end:]
          Path('.qa/full/supabase/config.toml').write_text(text)
          PY
      - name: Start real local Auth, REST, Storage and PostgreSQL
        run: |
          supabase start --workdir .qa/full > diagnostics/local-start.log 2>&1 || { tail -n 80 diagnostics/local-start.log; exit 1; }
          supabase status --workdir .qa/full -o env > .qa/local-status.env
      - name: Replay original SQL in disposable database with documented historical bootstrap ordering
        run: |
          python3 - <<'PY'
          import subprocess,os
          from pathlib import Path
          files=sorted(Path('supabase/migrations').glob('*.sql'))
          # Historical compatibility bridge precedes the table it requires in an empty DB.
          # Production files and SQL are untouched; this is a fresh-test bootstrap exception.
          bridge=next(p for p in files if p.name=='2026061300015_operator_pay_profiles_legacy_compat.sql')
          files.remove(bridge)
          engine=next(p for p in files if p.name=='202606130002_operator_payroll_engine.sql')
          files.insert(files.index(engine)+1,bridge)
          env={**os.environ,'PGHOST':'127.0.0.1','PGPORT':'54322','PGUSER':'postgres','PGDATABASE':'postgres','PGPASSWORD':'postgres'}
          with open('diagnostics/migration-replay.log','w') as log:
            log.write('ISOLATED LOOPBACK ONLY. Bootstrap ordering exception: payroll legacy bridge follows payroll engine.\n');log.flush()
            for p in files:
              log.write('\nAPPLY '+p.name+'\n');log.flush()
              r=subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-f',str(p)],env=env,stdout=log,stderr=log)
              if r.returncode:
                log.flush();print('\n'.join(Path(log.name).read_text(errors='replace').splitlines()[-100:]));raise SystemExit(r.returncode)
          print('All '+str(len(files))+' original SQL files applied in the disposable database.')
          PY
      - name: Install app and isolated browser test tools
        run: |
          npm ci
          npm install --prefix .qa/browser --no-package-lock --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          .qa/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Full-stack browser acceptance
        run: node scripts/company-e2e/run.mjs
      - name: Preserve failure details without credentials
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('diagnostics').glob('*.log'):
            text=p.read_text(errors='replace')
            text=re.sub(r'eyJ[A-Za-z0-9_\-.]+','[LOCAL_JWT_REDACTED]',text)
            text=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[LOCAL_KEY_REDACTED]',text)
            p.write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: company-full-stack-diagnostics
          path: |
            diagnostics/*.log
            diagnostics/company-e2e/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Destroy disposable local project
        if: always()
        run: supabase stop --workdir .qa/full --no-backup || true
