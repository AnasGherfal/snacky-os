name: Personal work migration identity
on:
  push:
    branches: ['feat/personal-work-today-v1']
    paths: ['.github/workflows/personal-work-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-work-today-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration filename, no database connection
        run: |
          supabase --version
          supabase --help >/dev/null
          supabase migration --help >/dev/null
          supabase migration new --help >/dev/null
          supabase migration new personal_work_today_v1
          rm .github/workflows/personal-work-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*personal_work_today_v1.sql .github/workflows/personal-work-scaffold.yml
          git commit -m 'chore(my-day): add CLI-generated read-only migration scaffold'
          git push origin HEAD:refs/heads/feat/personal-work-today-v1
