name: Stocktake migration scaffold
on:
  push:
    branches: ['feat/assigned-storage-stocktake-v1']
    paths: ['.github/workflows/stocktake-migration-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assigned-storage-stocktake-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration identity only
        run: |
          supabase --version
          supabase migration new assigned_storage_stocktake_v1
          rm .github/workflows/stocktake-migration-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*assigned_storage_stocktake_v1.sql .github/workflows/stocktake-migration-scaffold.yml
          git commit -m 'chore(stocktake): add CLI-generated migration scaffold'
          git push origin HEAD:refs/heads/feat/assigned-storage-stocktake-v1
