name: Finance Operations dashboard checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/app/finance/operations/page.tsx"
      - "src/lib/finance-operations.ts"
      - "src/components/module-tabs-config.ts"
      - "scripts/test-finance-operations-dashboard.mjs"
      - ".github/workflows/finance-operations-dashboard-check.yml"
  push:
    branches:
      - feature/finance-operations-dashboard
    paths:
      - "src/app/finance/operations/page.tsx"
      - "src/lib/finance-operations.ts"
      - "src/components/module-tabs-config.ts"
      - "scripts/test-finance-operations-dashboard.mjs"
      - ".github/workflows/finance-operations-dashboard-check.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test Finance Operations accounting contracts
        run: node --test scripts/test-finance-operations-dashboard.mjs
      - name: Build Snacky OS
        run: npm run build
