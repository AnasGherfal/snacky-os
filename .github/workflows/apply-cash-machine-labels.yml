name: Apply cash machine labels

on:
  push:
    branches:
      - improve/cash-machine-difference-visibility
    paths:
      - "scripts/apply-cash-machine-labels.py"
      - ".github/workflows/apply-cash-machine-labels.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/cash-machine-difference-visibility
      - name: Apply guarded integration
        run: python scripts/apply-cash-machine-labels.py
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/reports/cash-reconciliation/page.tsx
          git diff --cached --quiet || git commit -m "Clarify machine cash differences"
          git push origin HEAD:improve/cash-machine-difference-visibility
