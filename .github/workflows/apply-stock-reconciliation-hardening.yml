name: Apply stock reconciliation hardening

on:
  push:
    branches:
      - feature/missing-items-stock-reconciliation
    paths:
      - "scripts/apply-stock-reconciliation-hardening.py"
      - ".github/workflows/apply-stock-reconciliation-hardening.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-stock-reconciliation-hardening.py"
      - ".github/workflows/apply-stock-reconciliation-hardening.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/missing-items-stock-reconciliation
          fetch-depth: 0
      - name: Apply hardening integration
        run: python scripts/apply-stock-reconciliation-hardening.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- supabase/migrations/202607170001_stock_reconciliation_missing_items.sql src/app/inventory/reconciliation/page.tsx; then
            echo "Hardening already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202607170001_stock_reconciliation_missing_items.sql src/app/inventory/reconciliation/page.tsx
          git commit -m "Harden stock reconciliation physical counts"
          git push origin HEAD:feature/missing-items-stock-reconciliation
