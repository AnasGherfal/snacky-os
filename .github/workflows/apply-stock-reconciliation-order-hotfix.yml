name: Apply stock reconciliation SQL alias hotfix

on:
  push:
    branches:
      - hotfix/stock-reconciliation-missing-cost-order
    paths:
      - "scripts/apply-stock-reconciliation-order-hotfix.py"
      - ".github/workflows/apply-stock-reconciliation-order-hotfix.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-stock-reconciliation-order-hotfix.py"
      - ".github/workflows/apply-stock-reconciliation-order-hotfix.yml"
      - "supabase/migrations/202607170001_stock_reconciliation_missing_items.sql"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/stock-reconciliation-missing-cost-order
          fetch-depth: 0
      - name: Apply SQL alias hotfix
        run: python scripts/apply-stock-reconciliation-order-hotfix.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit corrected migration
        run: |
          if git diff --quiet -- supabase/migrations/202607170001_stock_reconciliation_missing_items.sql; then
            echo "Migration already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202607170001_stock_reconciliation_missing_items.sql
          git commit -m "Fix stock reconciliation missing cost ordering"
          git push origin HEAD:hotfix/stock-reconciliation-missing-cost-order
