name: Fix growth cost coverage

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-fix-growth-cost-coverage.py"
      - ".github/workflows/agent-fix-growth-cost-coverage.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-growth-cost-coverage
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Narrow duplicate monthly return anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent-fix-growth-cost-coverage.py")
          text = path.read_text(encoding="utf-8")
          old = '''    count = text.count(old)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)'''
          new = '''    count = text.count(old)\n    if label == "growth monthly product return first" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise RuntimeError(f"{label}: expected exactly one match, found {count}")\n    return text.replace(old, new, 1)'''
          if text.count(old) != 1:
              raise SystemExit("Could not update duplicate-anchor guard")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply prepared patch
        id: apply_patch
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/agent-fix-growth-cost-coverage.py 2>&1 | tee /tmp/growth-patch.log
      - name: Upload patch diagnostic
        if: steps.apply_patch.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: growth-patch-diagnostic
          path: /tmp/growth-patch.log
      - name: Stop after patch failure
        if: steps.apply_patch.outcome == 'failure'
        run: exit 1
      - name: Install dependencies
        run: npm ci
      - name: Test growth and investor portal
        run: node --experimental-strip-types --test scripts/test-growth-investor-portal.mjs
      - name: Test route pickup
        run: npm run test:route-pickup-checklist
      - name: Test route inventory
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-growth-cost-coverage
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/lib/growth-decision.ts",
              "src/app/finance/growth-decisions/page.tsx",
              "src/lib/investor-actions.ts",
              "scripts/test-growth-investor-portal.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              url = f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}"
              current = request_json(url)
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Fix growth cost coverage and investor VMS source",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
