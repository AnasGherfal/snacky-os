name: XY public sales API discovery
on:
  pull_request:
    paths:
      - "src/lib/xy-public-asset-paths.ts"
      - "scripts/discover-xy-public-sales.mjs"
      - ".github/workflows/xy-public-sales-discovery.yml"
  workflow_dispatch:
jobs:
  read-public-dashboard-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --experimental-strip-types scripts/discover-xy-public-sales.mjs
