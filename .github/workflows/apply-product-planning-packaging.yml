name: Apply product planning packaging integration

on:
  push:
    branches:
      - feature/product-planning-packaging
    paths:
      - "scripts/apply-product-planning-packaging.py"
      - ".github/workflows/apply-product-planning-packaging.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-product-planning-packaging.py"
      - ".github/workflows/apply-product-planning-packaging.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-planning-packaging
          fetch-depth: 0
      - name: Normalize fragile codemod matches
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-product-planning-packaging.py")
          source = path.read_text(encoding="utf-8")
          replacements = {
              "'                                                 <span className=\"mt-1 block text-xs text-slate-500\">Available for this row: {maxQty}</span>'": "'<span className=\"mt-1 block text-xs text-slate-500\">Available for this row: {maxQty}</span>'",
              "'                                                 <span className=\"mt-1 block text-xs text-slate-500\">Available for this row: {formatProductQuantity(maxQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })}</span>'": "'<span className=\"mt-1 block text-xs text-slate-500\">Available for this row: {formatProductQuantity(maxQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })}</span>'",
              "'                   {item.confirmedQty} / {item.plannedQty}'": "'{item.confirmedQty} / {item.plannedQty}'",
              "'                   {formatProductQuantity(item.confirmedQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })} / {formatProductQuantity(item.plannedQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })}'": "'{formatProductQuantity(item.confirmedQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })} / {formatProductQuantity(item.plannedQty, { caseQuantity: item.caseQuantity, productName: item.productName, category: item.productCategory }, { compact: true })}'",
              "'                       <div className=\"mt-1 text-sm text-slate-500\">{item.quantity} units</div>'": "'<div className=\"mt-1 text-sm text-slate-500\">{item.quantity} units</div>'",
              "'                       <div className=\"mt-1 text-sm text-slate-500\">{formatProductQuantity(item.quantity, { caseQuantity: productById.get(item.productId)?.caseQuantity ?? 1, productName: item.productName ?? productById.get(item.productId)?.name, category: productById.get(item.productId)?.category }, { compact: true })}</div>'": "'<div className=\"mt-1 text-sm text-slate-500\">{formatProductQuantity(item.quantity, { caseQuantity: productById.get(item.productId)?.caseQuantity ?? 1, productName: item.productName ?? productById.get(item.productId)?.name, category: productById.get(item.productId)?.category }, { compact: true })}</div>'",
              "'               Selected: {selected.name} - Storage {selected.availableStorageQty}'": "'Selected: {selected.name} - Storage {selected.availableStorageQty}'",
              "'               Selected: {selected.name} - Storage {formatProductQuantity(selected.availableStorageQty, { caseQuantity: selected.caseQuantity, productName: selected.name, category: selected.category }, { compact: true })}'": "'Selected: {selected.name} - Storage {formatProductQuantity(selected.availableStorageQty, { caseQuantity: selected.caseQuantity, productName: selected.name, category: selected.category }, { compact: true })}'",
          }
          for before, after in replacements.items():
              source = source.replace(before, after)
          path.write_text(source, encoding="utf-8")
          PY
      - name: Apply integration
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/apply-product-planning-packaging.py > product-planning-packaging.log 2>&1
          status=$?
          cat product-planning-packaging.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-planning-packaging-log
          path: product-planning-packaging.log
      - name: Stop on integration failure
        if: steps.apply.outputs.status != '0'
        run: exit 1
      - name: Validate diff
        run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/lib/authz.ts src/app/inventory/page.tsx src/app/api/operator/routes/[id]/pick-list/route.ts src/app/operator/routes/[id]/pick-list/page.tsx; then
            echo "Generated files already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/authz.ts src/app/inventory/page.tsx src/app/api/operator/routes/[id]/pick-list/route.ts src/app/operator/routes/[id]/pick-list/page.tsx
          git commit -m "Show product quantities as boxes and loose units"
          git push origin HEAD:feature/product-planning-packaging
