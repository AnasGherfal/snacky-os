name: Apply product planning packaging integration

on:
  push:
    branches:
      - feature/product-planning-packaging
    paths:
      - "scripts/apply-product-planning-packaging-v2.py"
      - ".github/workflows/apply-product-planning-packaging.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-product-planning-packaging-v2.py"
      - ".github/workflows/apply-product-planning-packaging.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-planning-packaging
          fetch-depth: 0
      - name: Apply robust integration
        id: apply
        shell: bash
        run: |
          set +e
          python scripts/apply-product-planning-packaging-v2.py > product-planning-packaging.log 2>&1
          status=$?
          cat product-planning-packaging.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-planning-packaging-log
          path: product-planning-packaging.log
      - name: Stop on integration failure
        if: steps.apply.outputs.status != '0'
        run: exit 1
      - name: Validate diff
        run: git diff --check
      - name: Commit generated changes
        run: |
          if git diff --quiet -- src/lib/authz.ts src/app/inventory/page.tsx src/app/api/operator/routes/[id]/pick-list/route.ts src/app/operator/routes/[id]/pick-list/page.tsx; then
            echo "Generated files already updated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/authz.ts src/app/inventory/page.tsx src/app/api/operator/routes/[id]/pick-list/route.ts src/app/operator/routes/[id]/pick-list/page.tsx
          git commit -m "Show product quantities as boxes and loose units"
          git push origin HEAD:feature/product-planning-packaging
