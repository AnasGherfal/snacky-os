name: Owner overview navigation integration
on:
  push:
    branches: ['feat/owner-operations-overview-v1']
    paths: ['.github/workflows/owner-navigation-scaffold.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-operations-overview-v1
      - name: Apply narrowly scoped existing-page links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/admin/page.tsx')
          s=p.read_text()
          anchor='const adminLinks = ['
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\n  {\n    title: "Owner Operations / متابعة العمليات",\n    href: "/admin/operations",\n    description: "Read-only follow-up for cash handovers, buying, storage counts, customer issues and team notification readiness.",\n  },',1)
          p.write_text(s)
          p=Path('src/components/StorageStocktakeWorkspace.tsx')
          s=p.read_text()
          changes=[
           ("export function StorageStocktakeWorkspace({userId}:{userId:string}){", "export function StorageStocktakeWorkspace({userId,initialId=null}:{userId:string;initialId?:string|null}){"),
           ("return <StorageStocktakeClient userId={userId}/>;", "return <StorageStocktakeClient key={initialId??'list'} userId={userId} initialId={initialId}/>;"),
           ("function StorageStocktakeClient({userId}:{userId:string}){", "function StorageStocktakeClient({userId,initialId}:{userId:string;initialId:string|null}){"),
           ("const [selected,setSelected]=useState<string|null>(null);", "const [selected,setSelected]=useState<string|null>(initialId);")
          ]
          for old,new in changes:
           assert s.count(old)==1,old
           s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('src/app/inventory/stocktake/page.tsx')
          s=p.read_text()
          assert "StorageStocktakeWorkspace userId={profile.id}" in s
          p.write_text("import {requireCurrentProfileForPath} from '@/lib/auth';\nimport {stocktakeUuid} from '@/lib/storage-stocktake';\nimport {StorageStocktakeWorkspace} from '@/components/StorageStocktakeWorkspace';\nexport const dynamic='force-dynamic';\nexport default async function StorageStocktakePage({searchParams}:{searchParams:Promise<{id?:string}>}){\n const profile=await requireCurrentProfileForPath('/inventory/stocktake');\n const query=await searchParams;\n const initialId=typeof query.id==='string'&&stocktakeUuid.test(query.id)?query.id:null;\n return <StorageStocktakeWorkspace userId={profile.id} initialId={initialId}/>;\n}\n")
          PY
          rm .github/workflows/owner-navigation-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/admin/page.tsx src/components/StorageStocktakeWorkspace.tsx src/app/inventory/stocktake/page.tsx .github/workflows/owner-navigation-scaffold.yml
          git commit -m 'feat(operations): link owner overview and open the selected stocktake'
          git push origin HEAD:refs/heads/feat/owner-operations-overview-v1
