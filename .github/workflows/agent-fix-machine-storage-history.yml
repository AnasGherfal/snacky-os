name: Validate machine storage and history fixes

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-fix-machine-storage-history.py"
      - ".github/workflows/agent-fix-machine-storage-history.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-machine-storage-and-history
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply machine storage and history patch
        run: python scripts/agent-fix-machine-storage-history.py
      - name: Install dependencies
        run: npm ci
      - name: Test critical workflows
        id: critical
        continue-on-error: true
        run: |
          set -o pipefail
          npm run test:critical-workflows 2>&1 | tee /tmp/machine-storage-history-test.log
      - name: Publish test diagnostic
        if: steps.critical.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-machine-storage-and-history
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          path = "scripts/agent-fix-machine-storage-history-error.txt"
          content = base64.b64encode(Path("/tmp/machine-storage-history-test.log").read_bytes()).decode()
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(request) as response: return json.load(response)
          sha = None
          try: sha = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}").get("sha")
          except HTTPError as error:
              if error.code != 404: raise
          payload = {"message": "Record machine storage history test failure", "content": content, "branch": branch}
          if sha: payload["sha"] = sha
          request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload=payload)
          PY
      - name: Stop after critical workflow failure
        if: steps.critical.outcome == 'failure'
        run: exit 1
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-machine-storage-and-history
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/routes/page.tsx",
              "src/app/machines/[id]/page.tsx",
              "src/app/team/[id]/page.tsx",
              "src/app/routes/[id]/page.tsx",
              "scripts/test-critical-workflows.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Fix machine storage semantics and route history",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
