name: XY clear-slot contract probe

on:
  push:
    branches:
      - verify-xy-clear-slot-contract-v2
      - master
    paths:
      - .github/workflows/xy-clear-slot-contract-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call fake-machine XY clear-slot probe
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" = "master" ]; then
            url="https://snacky-os.vercel.app/api/internal/xy-clear-slot-contract-v2?token=xy-clear-slot-contract-v2-20260930"
          else
            url="https://snacky-os-git-verify-xy-clear-slot-5b7119-anasgherfals-projects.vercel.app/api/internal/xy-clear-slot-contract-v2?token=xy-clear-slot-contract-v2-20260930"
          fi

          for attempt in {1..30}; do
            status="$(curl -sS -L --max-time 30 -o response.json -w '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]; then
              echo "XY clear-slot probe response (merchant identifier redacted):"
              jq '(.results[]?.request) |= del(.shbh)' response.json
              exit 0
            fi
            echo "Probe not ready yet (HTTP $status), attempt $attempt/30"
            sleep 10
          done

          echo "Probe endpoint did not return HTTP 200."
          if [ -s response.json ]; then
            jq '(.results[]?.request) |= del(.shbh)' response.json || cat response.json
          fi
          exit 1
