name: Apply stock reconciliation date safety

on:
  push:
    branches:
      - feature/missing-items-stock-reconciliation
    paths:
      - "scripts/apply-stock-reconciliation-date-safety.py"
      - ".github/workflows/apply-stock-reconciliation-date-safety.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/missing-items-stock-reconciliation
          fetch-depth: 0
      - name: Apply date-safety integration
        run: python scripts/apply-stock-reconciliation-date-safety.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- supabase/migrations/202607170001_stock_reconciliation_missing_items.sql src/app/inventory/reconciliation/page.tsx; then
            echo "Date safety already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/202607170001_stock_reconciliation_missing_items.sql src/app/inventory/reconciliation/page.tsx
          git commit -m "Prevent date-misaligned stock variances"
          git push origin HEAD:feature/missing-items-stock-reconciliation
