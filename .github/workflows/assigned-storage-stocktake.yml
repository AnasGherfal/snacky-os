name: Assigned storage stocktake checks
on:
  pull_request:
    paths:
      - 'src/app/inventory/stocktake/**'
      - 'src/app/api/storage-stocktake/**'
      - 'src/components/StorageStocktakeWorkspace.tsx'
      - 'src/components/module-tabs-config.ts'
      - 'src/lib/storage-stocktake.ts'
      - 'supabase/migrations/*assigned_storage_stocktake*'
      - 'scripts/test-assigned-storage-stocktake.mjs'
      - '.github/workflows/assigned-storage-stocktake.yml'
  push:
    branches: ['feat/assigned-storage-stocktake-v1']
permissions:
  contents: read
concurrency:
  group: assigned-stocktake-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contracts, TypeScript and focused lint
        run: |
          node --test scripts/test-assigned-storage-stocktake.mjs scripts/test-stock-reconciliation.mjs
          npm run typecheck
          npx eslint src/lib/storage-stocktake.ts src/components/StorageStocktakeWorkspace.tsx src/app/api/storage-stocktake/route.ts src/app/inventory/stocktake/page.tsx
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Disposable backend only
        run: |
          mkdir -p .qa/full/supabase diagnostics
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/config.toml').read_text().replace('project_id = "snacky-os"','project_id = "snacky-company-isolated"')
          for section in ['db.migrations','db.seed','studio','inbucket','realtime','edge_runtime']:
            start=text.index('['+section+']'); end=text.find('\n[',start+1)
            if end<0:end=len(text)
            text=text[:start]+text[start:end].replace('enabled = true','enabled = false')+text[end:]
          Path('.qa/full/supabase/config.toml').write_text(text)
          PY
          supabase start --workdir .qa/full > diagnostics/local-start.log 2>&1 || { tail -n 80 diagnostics/local-start.log; exit 1; }
          supabase status --workdir .qa/full -o env > .qa/local-status.env
          python3 scripts/company-e2e/migrate.py
      - name: Database security and additive schema smoke checks
        run: |
          export PGHOST=127.0.0.1 PGPORT=54322 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          test "$(psql -X -At -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='stocktake_private' and c.relname in ('assignments','lines','events','requests') and c.relrowsecurity")" = "4"
          test "$(psql -X -At -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname in ('snacky_storage_stocktake_workspace_v1','snacky_storage_stocktake_command_v1') and not p.prosecdef")" = "2"
          test "$(psql -X -At -c "select has_table_privilege('authenticated','stocktake_private.assignments','SELECT')")" = "f"
          test "$(psql -X -At -c "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='stocktake_private' and p.proname in ('workspace','command','ledger_quantity_at','manager','eligible_assignee','can_view')")" = "6"
      - name: Existing inventory and route regressions
        run: |
          npm run test:critical-workflows
          npm run test:route-ledger-core
      - name: Production build
        run: npm run build
      - name: Destroy disposable backend
        if: always()
        run: supabase stop --workdir .qa/full --no-backup || true
