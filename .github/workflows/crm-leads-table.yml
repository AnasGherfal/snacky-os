name: CRM leads table
on:
  pull_request:
    paths:
      - 'src/app/locations-pipeline/page.tsx'
      - 'src/components/CrmLead*'
      - 'src/lib/crm-lead-list.ts'
      - 'scripts/test-crm-lead-table.mjs'
      - 'scripts/crm-leads/**'
      - '.github/workflows/crm-leads-table.yml'
permissions:
  contents: read
concurrency:
  group: crm-leads-table-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Render, filter, access, failure and existing CRM regressions
        run: node --experimental-strip-types --test scripts/test-crm-lead-table.mjs scripts/test-connected-relations.mjs scripts/test-authz-permissions.mjs
      - name: Typecheck
        run: npm run typecheck
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prepare disposable loopback backend, never production
        run: |
          mkdir -p .qa/full/supabase diagnostics
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/config.toml').read_text().replace('project_id = "snacky-os"','project_id = "snacky-company-isolated"')
          for section in ['db.migrations','db.seed','studio','inbucket','realtime','edge_runtime']:
            start=text.index('['+section+']')
            end=text.find('\n[',start+1)
            if end<0:end=len(text)
            text=text[:start]+text[start:end].replace('enabled = true','enabled = false')+text[end:]
          Path('.qa/full/supabase/config.toml').write_text(text)
          PY
          supabase start --workdir .qa/full > diagnostics/local-start.log 2>&1 || { tail -n 60 diagnostics/local-start.log; exit 1; }
          supabase status --workdir .qa/full -o env > .qa/local-status.env
          python3 scripts/company-e2e/migrate.py
      - name: Install isolated browser tools
        id: tools
        run: |
          npm install --prefix .qa/browser --no-package-lock --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          .qa/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual application, sign-in, table, mobile and saved-record acceptance
        run: node --import ./scripts/company-e2e/diagnostics.mjs scripts/crm-leads/browser.mjs
      - name: Existing real integration suites
        if: always() && steps.tools.outcome == 'success'
        run: node scripts/company-e2e/native.mjs
      - name: Redact local runtime credentials from logs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('diagnostics').glob('*.log'):
            text=p.read_text(errors='replace')
            text=re.sub(r'eyJ[A-Za-z0-9_\-.]+','[LOCAL_JWT_REDACTED]',text)
            text=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[LOCAL_KEY_REDACTED]',text)
            p.write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-leads-acceptance
          path: |
            diagnostics/crm-leads/**
            diagnostics/*.log
            diagnostics/native-results.json
          retention-days: 7
      - name: Destroy disposable backend
        if: always()
        run: supabase stop --workdir .qa/full --no-backup || true
