name: App navigation checks

on:
  pull_request:
    paths:
      - 'src/components/**'
      - 'src/lib/authz.ts'
      - 'src/app/**'
      - 'scripts/test-app-navigation*'
      - '.github/workflows/app-navigation-check.yml'
      - 'package*.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test navigation ownership, roles and route coverage
        run: node --experimental-strip-types --test scripts/test-app-navigation.mjs
      - name: Typecheck Snacky OS
        run: npm run typecheck
      - name: Build Snacky OS
        run: npm run build
