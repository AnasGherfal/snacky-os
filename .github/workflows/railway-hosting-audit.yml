name: Audit hosting and URL references after Railway migration
on:
  pull_request:
    paths:
      - '.github/workflows/railway-hosting-audit.yml'
      - 'src/**'
      - 'scripts/**'
      - 'deployment/**'
      - 'next.config.ts'
      - '.env.example'
      - 'vercel.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inventory hosting references in application code
        shell: bash
        run: |
          echo '=== Runtime source: Vercel, Railway, hardcoded sites, app origins ==='
          grep -RInE -n -i -e 'vercel' -e 'railway' -e 'NEXT_PUBLIC_APP_URL' -e 'VERCEL_URL' -e 'APP_URL' -e 'up\\.railway\\.app' src next.config.ts package.json vercel.json || true
          echo '=== Framework hosting config and infrastructure ==='
          grep -RInE -n -i -e 'vercel' -e 'railway' -e 'https?://[^ \\"\x27<>]{1,120}' -e 'deploy' deployment .env.example README.md .github/workflows | head -n 300 || true
          echo '=== Hardcoded production URLs in runtime src ==='
          grep -RInE -n -i 'https?://[^ \\"\x27<>]*(vercel\\.app|railway\\.app|snacky)' src || true
          echo '=== Potential public-origin compare in APIs ==='
          grep -RInE -n -i -e 'request\\.url.*host' -e 'origin.*request\\.url' -e 'x-forwarded-proto' -e 'new URL\\(origin' src/app/api src/lib || true
          echo '=== Status of other Vercel-specific workflow files ==='
          grep -RInE -n -i 'vercel' .github/workflows || true
