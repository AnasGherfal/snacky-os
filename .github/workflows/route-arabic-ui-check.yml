name: Route Arabic UI checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/app/operator/routes/[id]/stops/[stopId]/page.tsx"
      - "src/app/api/operator/routes/[id]/stops/[stopId]/compensations/route.ts"
      - "src/app/api/compensations/history/route.ts"
      - "src/components/operator/RouteStopQuickActions.tsx"
      - "src/components/operator/CustomerCompensationHistoryPanel.tsx"
      - "src/components/operator/CompressorSafetyProofCard.tsx"
      - "src/components/operator/ManualRouteSalesSection.tsx"
      - "src/components/ShellChrome.tsx"
      - "supabase/migrations/202608150001_customer_compensation_completion.sql"
      - "scripts/apply-customer-compensation-route-patch.mjs"
      - "scripts/test-customer-compensation-route.mjs"
      - "scripts/test-route-arabic-ui.mjs"
      - "package.json"
      - ".github/workflows/route-arabic-ui-check.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test customer compensation and saved machine photo
        run: npm run test:customer-compensation
      - name: Test route language and encoding
        run: node --test scripts/test-route-arabic-ui.mjs
      - name: Test route safety and product activity
        run: node --test scripts/test-route-safety-product-activity.mjs
      - name: Check mojibake UI
        run: npm run check:mojibake-ui
      - name: Test pickup checklist
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
