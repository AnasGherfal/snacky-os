name: Buying to storage checks
on:
  push:
    branches: ['feat/buying-to-storage-v1']
  pull_request:
    paths:
      - 'src/lib/buying-*'
      - 'src/lib/purchase-actions.ts'
      - 'src/components/Buying*'
      - 'src/components/NewPurchaseWithReceiptScan.tsx'
      - 'src/components/PurchaseForm.tsx'
      - 'src/app/buying-lists/**'
      - 'src/app/purchases/new/**'
      - 'src/app/api/buying-lists/**'
      - 'supabase/migrations/*buying_to_storage*'
      - 'scripts/test-buying-to-storage*'
      - '.github/workflows/buying-to-storage.yml'
permissions:
  contents: read
concurrency:
  group: buying-storage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-buying-storage
          POSTGRES_DB: crm_tests
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Buying bridge contracts and existing buying regressions
        run: |
          node --experimental-strip-types --test scripts/test-buying-to-storage.mjs scripts/test-buying-sources.mjs scripts/test-shared-buying.mjs scripts/test-buying-print-css.mjs scripts/test-authz-permissions.mjs
      - name: TypeScript and focused lint
        run: |
          npm run typecheck
          npx eslint src/lib/buying-purchase.ts src/lib/buying-lists.ts src/lib/buying-server.ts src/components/NewPurchaseWithReceiptScan.tsx 'src/app/buying-lists/[id]/page.tsx' src/app/api/buying-lists/route.ts
      - name: Isolated database bridge acceptance
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: isolated-buying-storage
          PGDATABASE: crm_tests
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-buying-to-storage-db.sql
      - name: Existing purchase and inventory ledger regressions
        run: |
          npm run test:purchase-create-atomic-only
          npm run test:atomic-purchase-lifecycle
          npm run test:inventory-idempotency-contract
          npm run test:critical-workflows
      - name: Production build
        run: npm run build
