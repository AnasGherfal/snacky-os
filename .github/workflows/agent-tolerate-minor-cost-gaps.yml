name: Tolerate minor growth cost gaps

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-tolerate-minor-cost-gaps.py"
      - ".github/workflows/agent-tolerate-minor-cost-gaps.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tolerate-minor-cost-gaps
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply tolerance patch
        run: python scripts/agent-tolerate-minor-cost-gaps.py
      - name: Install dependencies
        run: npm ci
      - name: Test growth and investor portal
        run: node --experimental-strip-types --test scripts/test-growth-investor-portal.mjs
      - name: Test route pickup
        run: npm run test:route-pickup-checklist
      - name: Test route inventory
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/tolerate-minor-cost-gaps
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/finance/growth-decisions/page.tsx",
              "scripts/test-growth-investor-portal.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Allow minor missing-cost gaps in growth decisions",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
