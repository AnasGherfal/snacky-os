name: VMS duplicate-index safe migration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261110140952_remove_redundant_vms_import_lookup_indexes.sql'
      - 'scripts/test-redundant-vms-index-migration.mjs'
      - '.github/workflows/vms-duplicate-index-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-redundant-vms-index-migration.mjs
