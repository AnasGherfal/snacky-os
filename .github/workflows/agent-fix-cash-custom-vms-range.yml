name: Validate cash reconciliation custom VMS range

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-fix-cash-custom-vms-range.py"
      - ".github/workflows/agent-fix-cash-custom-vms-range.yml"
  push:
    branches:
      - agent/fix-cash-reconciliation-custom-vms-range
    paths:
      - "scripts/agent-fix-cash-custom-vms-range.py"
      - ".github/workflows/agent-fix-cash-custom-vms-range.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-cash-reconciliation-custom-vms-range
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply cash custom-range patch
        run: python scripts/agent-fix-cash-custom-vms-range.py
      - name: Install dependencies
        run: npm ci
      - name: Test cash reconciliation custom range
        run: node --test scripts/test-cash-reconciliation-selected-range.mjs
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-cash-reconciliation-custom-vms-range
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/reports/cash-reconciliation/page.tsx",
              "scripts/test-cash-reconciliation-selected-range.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Fix custom-range VMS cash reconciliation",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
