name: Buying receipt scoped polish
on:
  push:
    branches: [feat/buying-list-purchase-receipt-v1]
    paths: [.github/workflows/buying-purchase-polish.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/buying-list-purchase-receipt-v1
      - name: Apply reviewed receipt-only changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(path,old,new):
            p=Path(path);s=p.read_text()
            assert old in s, f'Missing reviewed anchor: {path}: {old[:100]}'
            p.write_text(s.replace(old,new,1))
          migration='supabase/migrations/20260924112418_buying_purchase_link_v1.sql'
          replace(migration," created_at timestamptz not null default now(),\n unique(list_id,supplier_id,receipt_sha256)"," created_at timestamptz not null default now(),\n retired_at timestamptz")
          replace(migration,"create unique index buying_receipt_number_once on buying_private.purchase_links(list_id,supplier_id,lower(receipt_number)) where receipt_number is not null;","create unique index buying_receipt_hash_once on buying_private.purchase_links(list_id,supplier_id,receipt_sha256) where retired_at is null;\ncreate unique index buying_receipt_number_once on buying_private.purchase_links(list_id,supplier_id,lower(receipt_number)) where receipt_number is not null and retired_at is null;")
          replace(migration,"   oldj:=to_jsonb(old);newj:=to_jsonb(new);","   oldj:=to_jsonb(old);newj:=to_jsonb(new);\n   if (old.status in ('cancelled','voided') or old.voided_at is not null)\n      and new.status not in ('cancelled','voided') and new.voided_at is null then\n    raise exception 'Cancelled linked receipts remain in history. Create a corrected receipt instead.' using errcode='23514';\n   end if;\n   if new.status in ('cancelled','voided') or new.voided_at is not null then\n    update buying_private.purchase_links set retired_at=coalesce(retired_at,clock_timestamp()) where purchase_id=pid;\n   end if;")
          replace(migration,"where b.list_id=lid and b.supplier_id=sid\n    and (b.receipt_sha256=sha", "where b.list_id=lid and b.supplier_id=sid and b.retired_at is null\n    and (b.receipt_sha256=sha")
          replace(migration," if jsonb_typeof(p_command) is distinct from 'object' or octet_length(p_command::text)>100000 then", " if jsonb_typeof(p_command) is distinct from 'object' or p_command-array['request_id','list_id','revision','action','payload']<>'{}'::jsonb or octet_length(p_command::text)>100000 then")
          page='src/app/buying-lists/[id]/purchases/page.tsx'
          replace(page,'return <main className=', 'return <section className=')
          replace(page,' </main>;',' </section>;')
          api='src/app/api/buying-lists/purchases/route.ts'
          replace(api,'body:bytes}).formData()', 'body:new Uint8Array(bytes).buffer}).formData()')
          ui='src/components/BuyingPurchaseClient.tsx'
          replace(ui,"onChange={e=>setSupplier(e.target.value)}", "onChange={e=>{const next=e.target.value;if(items.some(i=>drafts[i.product_id]?.include)&&!window.confirm(ar?'تغيير المتجر يمسح اختيار المنتجات وأسعار الإيصال غير المحفوظة. متابعة؟':'Changing store clears unsaved product selections and actual prices. Continue?'))return;setSupplier(next);setDrafts(current=>Object.fromEntries(Object.entries(current).map(([id,d])=>[id,{...d,include:false,total:''}])));}}")
          test='scripts/buying-purchase-e2e.mjs'
          replace(test,"page.getByLabel('Receipt image or PDF',{exact:true}).setInputFiles", "page.locator('input[type=file]').setInputFiles")
          PY
          rm .github/workflows/buying-purchase-polish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260924112418_buying_purchase_link_v1.sql src/app/buying-lists src/app/api/buying-lists/purchases src/components/BuyingPurchaseClient.tsx scripts/buying-purchase-e2e.mjs .github/workflows/buying-purchase-polish.yml
          git diff --cached --check
          git commit -m 'fix(buying): preserve cancellation history and receipt-specific price entry'
          git push origin HEAD:refs/heads/feat/buying-list-purchase-receipt-v1
