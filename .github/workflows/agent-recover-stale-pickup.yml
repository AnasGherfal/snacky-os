name: Validate stale pickup recovery

on:
  push:
    branches:
      - agent/recover-stale-pickup-batch

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/recover-stale-pickup-batch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stale pickup recovery
        run: python scripts/agent-recover-stale-pickup.py
      - name: Install dependencies
        run: npm ci
      - name: Test stale pickup recovery
        run: node --test scripts/test-stale-pickup-recovery.mjs
      - name: Test route pickup checklist
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/operator/routes/[id]/pick-list/route.ts src/app/operator/routes/[id]/pick-list/page.tsx scripts/test-stale-pickup-recovery.mjs
          git diff --cached --quiet || git commit -m "Recover stale prepared pickup batches"
          git push origin HEAD:agent/recover-stale-pickup-batch
