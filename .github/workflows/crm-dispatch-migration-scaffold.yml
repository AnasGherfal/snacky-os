name: CRM dispatch migration scaffold
on:
  push:
    branches: ['feat/crm-operator-dispatch-v1']
    paths: ['.github/workflows/crm-dispatch-migration-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/crm-operator-dispatch-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration identity only
        run: |
          supabase --version
          supabase migration new crm_operator_dispatch_v1
          rm .github/workflows/crm-dispatch-migration-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*crm_operator_dispatch_v1.sql .github/workflows/crm-dispatch-migration-scaffold.yml
          git commit -m 'chore(crm): add CLI-generated dispatch migration scaffold'
          git push origin HEAD:refs/heads/feat/crm-operator-dispatch-v1
