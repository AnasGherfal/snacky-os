name: Validate growth cost coverage v3

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-fix-growth-cost-coverage.py"
      - "scripts/agent-fix-growth-cost-coverage-v3.py"
      - ".github/workflows/agent-fix-growth-cost-coverage-v3.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-growth-cost-coverage-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared patch
        id: patch
        continue-on-error: true
        run: python scripts/agent-fix-growth-cost-coverage-v3.py
      - name: Publish patch diagnostic
        if: steps.patch.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-growth-cost-coverage-v3
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          path = "scripts/agent-growth-patch-error.txt"
          content = base64.b64encode(Path(path).read_bytes()).decode()
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(req) as response: return json.load(response)
          sha = None
          try: sha = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}").get("sha")
          except HTTPError as error:
              if error.code != 404: raise
          payload = {"message": "Record growth patch diagnostic", "content": content, "branch": branch}
          if sha: payload["sha"] = sha
          request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload=payload)
          PY
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Install dependencies
        run: npm ci
      - name: Test growth and investor portal
        id: growth_test
        continue-on-error: true
        run: |
          set -o pipefail
          node --experimental-strip-types --test scripts/test-growth-investor-portal.mjs 2>&1 | tee /tmp/growth-test.log
      - name: Publish growth test diagnostic
        if: steps.growth_test.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-growth-cost-coverage-v3
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          path = "scripts/agent-growth-test-error.txt"
          content = base64.b64encode(Path("/tmp/growth-test.log").read_bytes()).decode()
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(req) as response: return json.load(response)
          sha = None
          try: sha = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}").get("sha")
          except HTTPError as error:
              if error.code != 404: raise
          payload = {"message": "Record growth test diagnostic", "content": content, "branch": branch}
          if sha: payload["sha"] = sha
          request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload=payload)
          PY
      - name: Stop after growth test failure
        if: steps.growth_test.outcome == 'failure'
        run: exit 1
      - name: Test route pickup
        run: npm run test:route-pickup-checklist
      - name: Test route inventory
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/fix-growth-cost-coverage-v3
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = ["src/lib/growth-decision.ts", "src/app/finance/growth-decisions/page.tsx", "src/lib/investor-actions.ts", "scripts/test-growth-investor-portal.mjs"]
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(req) as response: return json.load(response)
          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload={"message": "Fix growth cost coverage and investor VMS source", "content": content, "sha": current["sha"], "branch": branch})
          PY
