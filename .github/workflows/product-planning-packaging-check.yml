name: Product planning and packaging checks

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/app/product-planning/**"
      - "src/app/inventory/page.tsx"
      - "src/app/operator/routes/**"
      - "src/app/api/operator/routes/**"
      - "src/components/module-tabs-config.ts"
      - "src/lib/authz.ts"
      - "src/lib/product-planning.ts"
      - "src/lib/product-quantity.ts"
      - "supabase/migrations/202607160001_product_monthly_purchase_plans.sql"
      - "scripts/test-product-planning-packaging.mjs"
      - "scripts/ts-alias-loader.mjs"
      - ".github/workflows/product-planning-packaging-check.yml"
  push:
    branches:
      - feature/product-planning-packaging
    paths:
      - "src/app/product-planning/**"
      - "src/app/inventory/page.tsx"
      - "src/app/operator/routes/**"
      - "src/app/api/operator/routes/**"
      - "src/components/module-tabs-config.ts"
      - "src/lib/authz.ts"
      - "src/lib/product-planning.ts"
      - "src/lib/product-quantity.ts"
      - "supabase/migrations/202607160001_product_monthly_purchase_plans.sql"
      - "scripts/test-product-planning-packaging.mjs"
      - "scripts/ts-alias-loader.mjs"
      - ".github/workflows/product-planning-packaging-check.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test product planning and packaging
        id: tests
        shell: bash
        run: |
          set +e
          node --experimental-strip-types --loader ./scripts/ts-alias-loader.mjs --test scripts/test-product-planning-packaging.mjs > product-planning-test.log 2>&1
          status=$?
          cat product-planning-test.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-planning-test-log
          path: product-planning-test.log
      - name: Stop on test failure
        if: steps.tests.outputs.status != '0'
        run: exit 1
      - name: Build Snacky OS
        run: npm run build
