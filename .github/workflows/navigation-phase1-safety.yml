name: Navigation phase 1 safety checks
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/components/ModuleTabs.tsx'
      - 'src/components/module-navigation-organization.ts'
      - 'src/components/module-tabs-config.ts'
      - 'src/components/app-navigation.ts'
      - 'src/components/Sidebar.tsx'
      - 'scripts/test-module-navigation-redesign.mjs'
      - '.github/workflows/navigation-phase1-safety.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Navigation and authorization regressions
        run: node --experimental-strip-types --test scripts/test-module-navigation-redesign.mjs scripts/test-sidebar-prefetch-budget.mjs scripts/test-authz-permissions.mjs
      - name: Lint touched navigation files
        run: npx eslint src/components/ModuleTabs.tsx src/components/module-navigation-organization.ts src/components/module-tabs-config.ts src/components/app-navigation.ts src/components/Sidebar.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Full production build and existing prebuild regressions
        run: npm run build
