name: Operator self-dispatch
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/operator-self-dispatch.yml'
      - 'src/**/self-dispatch*'
      - 'src/**/today-work/**'
      - 'src/**/work-board/**'
      - 'scripts/test-self-dispatch*'
      - 'scripts/self-dispatch-e2e/**'
      - 'supabase/migrations/*self_dispatch*'
permissions:
  contents: read
concurrency:
  group: self-dispatch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration filename using CLI
        run: |
          mkdir -p diagnostics
          if ! ls supabase/migrations/*operator_self_dispatch.sql >/dev/null 2>&1; then
            supabase migration new operator_self_dispatch
          fi
          ls supabase/migrations/*operator_self_dispatch.sql > diagnostics/migration-name.txt
      - name: Package credential-free verification sources
        run: |
          tar --exclude='.env*' --exclude='node_modules' --exclude='.temp' --exclude='.branches' -czf diagnostics/verification-source.tar.gz src scripts supabase package.json package-lock.json tsconfig.json next.config.* next-env.d.ts postcss.config.* 2>/dev/null || test -f diagnostics/verification-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: self-dispatch-verification-source
          path: |
            diagnostics/verification-source.tar.gz
            diagnostics/migration-name.txt
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dispatch behavioural tests
        run: |
          if test -f scripts/test-self-dispatch.mjs; then
            node --experimental-strip-types --loader ./scripts/ts-alias-loader.mjs --test scripts/test-self-dispatch*.mjs
          else
            echo 'Migration naming stage; behavioral tests follow.'
          fi
      - name: Type check
        run: npx tsc --noEmit
