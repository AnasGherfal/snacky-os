name: Operator self-dispatch
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/operator-self-dispatch.yml'
      - 'src/**/self-dispatch*'
      - 'src/**/today-work/**'
      - 'src/**/work-board/**'
      - 'scripts/test-self-dispatch*'
      - 'supabase/migrations/*self_dispatch*'
permissions:
  contents: read
concurrency:
  group: self-dispatch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source snapshot for isolated verification
        run: |
          mkdir -p diagnostics
          git archive --format=zip HEAD > diagnostics/source.zip
          git rev-parse HEAD > diagnostics/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: self-dispatch-source
          path: diagnostics/source*
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dispatch behavioural tests
        run: |
          if test -f scripts/test-self-dispatch.mjs; then
            node --experimental-strip-types --loader ./scripts/ts-alias-loader.mjs --test scripts/test-self-dispatch*.mjs
          else
            echo 'Source inspection stage; dispatch implementation follows.'
          fi
      - name: Type check
        run: npx tsc --noEmit
