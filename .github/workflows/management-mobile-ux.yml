name: Management mobile navigation and RTL Storage
on:
  pull_request:
    branches: [master, release/snacky-os-combined-staging-20261024]
    paths:
      - "src/components/RoleMobileNavigation.tsx"
      - "src/lib/role-mobile-navigation.ts"
      - "src/components/Sidebar.tsx"
      - "src/app/operator/routes/page.tsx"
      - "src/components/CrmWorkspace.tsx"
      - "src/components/app-navigation.ts"
      - "src/components/ShellChrome.tsx"
      - "src/components/ModuleTabs.tsx"
      - "src/components/module-tabs-config.ts"
      - "src/app/inventory/page.tsx"
      - "scripts/test-role-mobile-navigation.mjs"
      - "scripts/test-operator-route-views.mjs"
      - "scripts/test-crm-mobile-focus.mjs"
      - "scripts/test-navigation-organization.mjs"
      - "scripts/test-assigned-storage-stocktake.mjs"
      - "scripts/test-simple-monthly-stock-check.mjs"
      - "scripts/test-stock-reconciliation.mjs"
      - ".github/workflows/management-mobile-ux.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run mobile navigation and bilingual Storage contracts
        run: node --experimental-strip-types --loader ./scripts/ts-alias-loader.mjs --test scripts/test-role-mobile-navigation.mjs scripts/test-operator-route-views.mjs scripts/test-crm-mobile-focus.mjs scripts/test-navigation-organization.mjs scripts/test-simple-monthly-stock-check.mjs scripts/test-assigned-storage-stocktake.mjs scripts/test-stock-reconciliation.mjs
      - name: Lint new mobile navigation and shell
        run: npx eslint src/components/RoleMobileNavigation.tsx src/lib/role-mobile-navigation.ts src/components/ShellChrome.tsx src/components/Sidebar.tsx src/components/ModuleTabs.tsx src/components/module-tabs-config.ts src/components/app-navigation.ts src/app/operator/routes/page.tsx
      - name: Lint Storage layout (legacy any typing deferred)
        run: npx eslint src/app/inventory/page.tsx --rule '@typescript-eslint/no-explicit-any: off'
      - name: Lint CRM workspace (pre-existing any typing deferred)
        run: npx eslint src/components/CrmWorkspace.tsx --rule "@typescript-eslint/no-explicit-any: off"
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
