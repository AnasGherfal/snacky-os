name: Verify One-Tap XY
on:
  push:
    branches:
      - fix/one-tap-offline-xy-change
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Smart Route tests
        run: npm run test:smart-route-planner
      - name: XY contract tests
        run: node --experimental-strip-types --test scripts/test-xy-slot-write-endpoint.mjs
      - name: Typecheck
        run: npm run typecheck
