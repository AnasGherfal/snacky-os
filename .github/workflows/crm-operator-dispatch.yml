name: CRM operator dispatch checks
on:
  push:
    branches: ['feat/crm-operator-dispatch-v1']
  pull_request:
    paths:
      - 'src/lib/crm-dispatch.ts'
      - 'src/lib/crm-workspace.ts'
      - 'src/components/CrmDispatchPanel.tsx'
      - 'src/components/CrmWorkspace.tsx'
      - 'src/components/CrmRecordForms.tsx'
      - 'src/app/api/crm/dispatch/**'
      - 'supabase/migrations/*crm_operator_dispatch*'
      - 'scripts/test-crm-operator-dispatch.mjs'
      - 'scripts/crm-operator-dispatch-db-acceptance.sql'
      - '.github/workflows/crm-operator-dispatch.yml'
permissions:
  contents: read
concurrency:
  group: crm-dispatch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-dispatch-only
          POSTGRES_DB: crm_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-dispatch-only
      PGDATABASE: crm_tests

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Dispatch contracts and existing CRM/notification regressions
        run: |
          node --test scripts/test-crm-operator-dispatch.mjs
          node --experimental-strip-types --test scripts/test-connected-relations.mjs scripts/test-assignment-notifications.mjs scripts/test-authz-permissions.mjs

      - name: TypeScript and focused lint
        run: |
          npm run typecheck
          npx eslint src/lib/crm-dispatch.ts src/lib/crm-workspace.ts src/components/CrmDispatchPanel.tsx src/components/CrmWorkspace.tsx src/components/CrmRecordForms.tsx src/app/api/crm/dispatch/route.ts

      - name: Build isolated CRM schema plus dispatch migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path('scripts/test-connected-relations-db.sql').read_text()
          marker='\\ir ../supabase/migrations/20260915200400_connected_relations_api_boundary.sql'
          start=source.index(marker)
          end=source.index('\n',start)+1
          Path('scripts/.crm-dispatch-isolated.sql').write_text(
            source[:end] + '\n\\ir crm-operator-dispatch-db-acceptance.sql\n'
          )
          PY
          psql -X -v ON_ERROR_STOP=1 -f scripts/.crm-dispatch-isolated.sql

      - name: Existing critical workflow safety
        run: npm run test:critical-workflows

      - name: Production build
        run: npm run build
