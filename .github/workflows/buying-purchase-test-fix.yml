name: Buying receipt acceptance refinement
on:
  push:
    branches: [feat/buying-list-purchase-receipt-v1]
    paths: [.github/workflows/buying-purchase-test-fix.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/buying-list-purchase-receipt-v1
      - name: Refine actual receipt lifecycle tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/buying-purchase-e2e.mjs');s=p.read_text()
          old="p_manual_total_lyd:24,p_lines:[{product_id:products[0].id,line_position:0,boxes_qty:2,units_per_box:12,loose_units_qty:0,line_total:24}]"
          new="p_manual_total_lyd:24,p_lines:[{product_id:products[0].id,line_position:0,boxes_qty:2,units_per_box:12,loose_units_qty:0,total_units:24,ordered_qty:24,received_qty:0,line_total:24}]"
          assert old in s;s=s.replace(old,new,1)
          s=s.replace("assert.equal(r.error?.code,'23514');", "assert.equal(r.error?.code,'23514',JSON.stringify(r.error));")
          marker="await check('private receipt tables and public invoker boundaries stay restricted'"
          assert marker in s
          addition="""await check('cancelled draft retains history and permits one corrected copy of the same store receipt',async()=>{
           const id=await seedList('Receipt correction acceptance'),c=await createCommand({id}),before=qty(products[0]);
           const original=await run(c);assert.ifError(original.error);
           const cancelled=await accounts.buyer.client.rpc('snacky_cancel_draft_purchase_v1',{p_purchase_id:original.data.purchase_id,p_reason:'Correcting input before stock receipt',p_client_submission_id:randomUUID()});assert.ifError(cancelled.error);
           assert.equal((await view(id)).items[0].remaining_units,24);assert.equal(qty(products[0]),before);
           const corrected={...c,request_id:randomUUID(),revision:(await view(id)).revision,payload:{...c.payload,note:'Corrected entry with preserved original receipt history'}};
           const saved=await run(corrected);assert.ifError(saved.error);assert.notEqual(saved.data.purchase_id,original.data.purchase_id);
           const history=await view(id);assert.equal(history.receipts.length,2);assert.equal(history.receipts.filter(r=>r.status==='cancelled').length,1);assert.equal(history.items[0].remaining_units,12);assert.equal(qty(products[0]),before);
           assert.equal(sql(`select count(*) from buying_private.purchase_links where list_id='${id}' and retired_at is not null`),'1');
           assert.equal((await run({...corrected,request_id:randomUUID(),revision:history.revision})).error?.code,'23505');
          });
          """
          s=s.replace(marker,addition+marker,1)
          p.write_text(s)
          PY
          rm .github/workflows/buying-purchase-test-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/buying-purchase-e2e.mjs .github/workflows/buying-purchase-test-fix.yml
          git diff --cached --check
          git commit -m 'test(buying): verify receipt corrections through the real draft lifecycle'
          git push origin HEAD:refs/heads/feat/buying-list-purchase-receipt-v1
