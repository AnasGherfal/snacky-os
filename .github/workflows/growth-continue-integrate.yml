name: Integrate continued reliability fixes
on:
  push:
    branches: [qa/snacky-growth-continue-20261112]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/snacky-growth-continue-20261112
      - name: Apply exact reviewed source patch
        run: python .growth-continuation/apply.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify focused fixes and the complete unit sweep without live credentials
        run: |
          mkdir -p continuation-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          for(const key of Object.keys(process.env))if(/SUPABASE|SMOKE_TEST|QA_PASSWORD/.test(key))throw Error('No external credentials allowed');
          const files=fs.readdirSync('scripts').filter(f=>f.endsWith('.mjs')&&/from\s+['"]node:test['"]/.test(fs.readFileSync('scripts/'+f,'utf8'))).sort().map(f=>'scripts/'+f);
          const r=spawnSync(process.execPath,['--experimental-strip-types','--experimental-vm-modules','--loader','./scripts/ts-alias-loader.mjs','--test','--test-concurrency=4',...files],{encoding:'utf8',timeout:300000,maxBuffer:40e6});
          fs.writeFileSync('continuation-evidence/all-unit.tap',(r.stdout??'')+'\n'+(r.stderr??''));
          console.log((r.stdout??'').slice(-2500));
          if(r.status!==0)process.exit(r.status??1);
          const t=spawnSync('npm',['run','typecheck'],{encoding:'utf8',timeout:180000,maxBuffer:20e6});
          fs.writeFileSync('continuation-evidence/typecheck.log',(t.stdout??'')+'\n'+(t.stderr??''));
          if(t.status!==0)process.exit(t.status??1);
          NODE
      - name: Save tested changes only on this temporary branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          if ! git diff --cached --quiet; then
            git commit -m 'Fix stale regression assertions, restore bilingual cash guidance and harden QA targets'
            git push origin HEAD:refs/heads/qa/snacky-growth-continue-20261112
          fi
          git rev-parse HEAD > continuation-evidence/candidate-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-checks-${{ github.run_id }}
          path: continuation-evidence/
          retention-days: 7
