name: Pickup RPC chain regression

on:
  pull_request:
    paths:
      - "supabase/migrations/202607150003_route_pickup_two_stage_workflow.sql"
      - "supabase/migrations/202607150006_route_pickup_rpc_chain_repair.sql"
      - "scripts/test-route-pickup-rpc-chain-repair.mjs"
  push:
    branches:
      - master
    paths:
      - "supabase/migrations/202607150006_route_pickup_rpc_chain_repair.sql"
      - "scripts/test-route-pickup-rpc-chain-repair.mjs"

jobs:
  pickup-rpc-chain-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run pickup RPC chain regression
        run: node --test scripts/test-route-pickup-rpc-chain-repair.mjs
