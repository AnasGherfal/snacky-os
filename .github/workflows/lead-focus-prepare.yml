name: Prepare lead focus review
on:
  push:
    branches: [feat/crm-lead-focus]
    paths: [.github/workflows/lead-focus-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration filename using CLI and export tracked source only
        run: |
          mkdir -p diagnostics
          supabase migration new --help
          supabase migration new crm_lead_focus
          cp supabase/migrations/*_crm_lead_focus.sql diagnostics/
          git archive --format=tar.gz -o diagnostics/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: lead-focus-review-source
          path: diagnostics/*
          retention-days: 2
