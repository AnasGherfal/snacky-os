name: Validate stop-only route planning

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-route-stop-planning.py"
      - ".github/workflows/agent-route-stop-planning.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-stop-planning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Normalize formatted patch anchors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/agent-route-stop-planning.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          old = old.replace("              count", "    count").replace("              if", "    if").replace("                  raise", "        raise").replace("              return", "    return")
          new = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if label == "sticky summary mode" and count == 0:
                  pattern = r"(?m)^(\\s*)\\{selectedProducts\\.length\\} items selected · \\{plannedRouteStock\\.reduce\\(\\(sum, item\\) => sum \\+ unitQuantity\\(item\\.quantity\\), 0\\)\\} total units\\s*$"
                  match = re.search(pattern, text)
                  if match:
                      replacement = f"{match.group(1)}{new.strip()}"
                      return text[:match.start()] + replacement + text[match.end():]
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)
          '''
          new = new.replace("              count", "    count").replace("              if label", "    if label").replace("                  pattern", "        pattern").replace("                  match", "        match").replace("                  if match", "        if match").replace("                      replacement", "            replacement").replace("                      return", "            return").replace("              if count", "    if count").replace("                  raise", "        raise").replace("              return", "    return")
          if text.count(old) != 1:
              raise SystemExit("Could not locate patch helper for formatted-anchor normalization.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Apply stop-only route patch
        id: patch
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/agent-route-stop-planning.py 2>&1 | tee /tmp/route-stop-planning-patch.log
      - name: Publish patch diagnostic
        if: steps.patch.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/route-stop-planning
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          path = "scripts/agent-route-stop-planning-error.txt"
          content = base64.b64encode(Path("/tmp/route-stop-planning-patch.log").read_bytes()).decode()
          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(url, data=data, method=method, headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urlopen(request) as response: return json.load(response)
          sha = None
          try: sha = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}").get("sha")
          except HTTPError as error:
              if error.code != 404: raise
          payload = {"message": "Record stop-only route patch diagnostic", "content": content, "branch": branch}
          if sha: payload["sha"] = sha
          request_json(f"https://api.github.com/repos/{repository}/contents/{path}", method="PUT", payload=payload)
          PY
      - name: Stop after patch failure
        if: steps.patch.outcome == 'failure'
        run: exit 1
      - name: Install dependencies
        run: npm ci
      - name: Test route workflow
        run: npm run test:route-workflow
      - name: Test pickup checklist
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/route-stop-planning
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/routes/new/RouteCreateForm.tsx",
              "src/app/api/routes/route.ts",
              "src/app/routes/[id]/page.tsx",
              "src/app/operator/routes/[id]/page.tsx",
              "src/lib/operator-actions.ts",
              "src/app/routes/[id]/edit/page.tsx",
              "src/app/routes/[id]/edit/RouteItemEditor.tsx",
              "scripts/test-critical-workflows.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Add two-stage stop-only route planning",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
