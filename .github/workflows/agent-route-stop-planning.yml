name: Validate stop-only route planning

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-route-stop-planning.py"
      - ".github/workflows/agent-route-stop-planning.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/route-stop-planning
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply stop-only route patch
        run: python scripts/agent-route-stop-planning.py
      - name: Install dependencies
        run: npm ci
      - name: Test route workflow
        run: npm run test:route-workflow
      - name: Test pickup checklist
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/route-stop-planning
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/routes/new/RouteCreateForm.tsx",
              "src/app/api/routes/route.ts",
              "src/app/routes/[id]/page.tsx",
              "src/app/operator/routes/[id]/page.tsx",
              "src/lib/operator-actions.ts",
              "src/app/routes/[id]/edit/page.tsx",
              "src/app/routes/[id]/edit/RouteItemEditor.tsx",
              "scripts/test-critical-workflows.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              current = request_json(f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}")
              content = base64.b64encode(Path(path).read_bytes()).decode()
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload={
                      "message": "Add two-stage stop-only route planning",
                      "content": content,
                      "sha": current["sha"],
                      "branch": branch,
                  },
              )
          PY
