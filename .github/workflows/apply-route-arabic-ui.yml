name: Apply route Arabic UI integration

on:
  push:
    branches:
      - fix/route-arabic-no-mix
    paths:
      - "scripts/apply-route-language-hardening-components.py"
      - "scripts/apply-route-language-hardening-page.py"
      - ".github/workflows/apply-route-arabic-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/route-arabic-no-mix
      - name: Apply language hardening
        run: |
          python scripts/apply-route-language-hardening-components.py
          python scripts/apply-route-language-hardening-page.py
      - name: Commit route language hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189822+github-actions[bot]@users.noreply.github.com"
          git add src/components/operator/CompressorSafetyProofCard.tsx src/components/operator/ManualRouteSalesSection.tsx src/app/operator/routes/[id]/stops/[stopId]/page.tsx
          git diff --cached --quiet || git commit -m "Harden Arabic route stop localization"
          git push origin HEAD:fix/route-arabic-no-mix
