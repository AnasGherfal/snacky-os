name: Apply route Arabic UI integration

on:
  push:
    branches:
      - fix/route-arabic-no-mix
    paths:
      - "scripts/apply-route-language-final.py"
      - ".github/workflows/apply-route-arabic-ui.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/route-arabic-no-mix
      - name: Apply final language fixes
        run: python scripts/apply-route-language-final.py
      - name: Commit final route language fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/operator/routes/[id]/stops/[stopId]/page.tsx
          git diff --cached --quiet || git commit -m "Complete Arabic route stop localization"
          git push origin HEAD:fix/route-arabic-no-mix
