name: Investor access and monthly accounting
on:
  pull_request:
    paths:
      - 'src/lib/investor*'
      - 'src/lib/team*'
      - 'src/lib/finance-balance.ts'
      - 'src/components/Investor*'
      - 'src/components/TeamMemberForm.tsx'
      - 'src/app/investor/**'
      - 'src/app/finance/investors/**'
      - 'supabase/migrations/*investor*'
      - 'scripts/test-investor*'
      - '.github/workflows/investor-access-check.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: investor_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Role and monthly accounting regressions
        run: node --experimental-strip-types --test scripts/test-investor-access-accounting.mjs scripts/test-growth-investor-portal.mjs
      - name: Actual investor migrations and atomic ledger tests in isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: isolated-test-only
          PGDATABASE: investor_tests
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-investor-ledger.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
