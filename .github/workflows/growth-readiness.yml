name: Growth readiness
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths: ['src/**', 'scripts/**', 'supabase/**', 'package*.json', 'next.config.ts', 'tsconfig.json', '.github/workflows/growth-readiness.yml']
  push:
    branches: [master, fix/snacky-growth-hardening-20261112]
    paths: ['src/**', 'scripts/**', 'supabase/**', 'package*.json', 'next.config.ts', 'tsconfig.json', '.github/workflows/growth-readiness.yml']
permissions:
  contents: read
concurrency:
  group: growth-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check reliability, types and production build without production credentials
        run: |
          mkdir -p growth-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const names=['audit:performance','test:growth-hardening','test:route-ledger-core','test:authz-permissions','test:finance-ledger','test:restock-priority','test:vms-sales-import','test:vms-import-validation','test:route-workflow','test:cash-removal','test:growth-cash-regression','test:smart-route-planner','test:smart-route-unified-editor','test:xy-stop-quantity-editor','test:xy-live-sales','test:xy-operational-alerts'];
          const scripts=JSON.parse(fs.readFileSync('package.json','utf8')).scripts;
          const checks=[];
          function run(name,command,args,timeout=120000){
            const start=Date.now();
            const r=spawnSync(command,args,{encoding:'utf8',timeout,maxBuffer:32*1024*1024});
            fs.writeFileSync(`growth-evidence/${name.replaceAll(':','_')}.log`,`${r.stdout??''}\n${r.stderr??''}`);
            checks.push({name,status:r.status===0?'passed':'failed',exit_code:r.status,duration_ms:Date.now()-start});
            console.log(name,r.status===0?'PASS':'FAIL');
          }
          for(const name of names){
            if(!scripts[name]){checks.push({name,status:'failed',reason:'Required script missing'});continue;}
            run(name,'npm',['run',name]);
          }
          run('restock-schema-runtime','node',['--experimental-strip-types','--test','scripts/test-growth-restock-schema.mjs']);
          run('typescript','npm',['run','typecheck'],180000);
          if(checks.every(c=>c.status==='passed'))run('production-build-with-prebuild','npm',['run','build'],540000);
          else checks.push({name:'production-build-with-prebuild',status:'blocked'});
          fs.writeFileSync('growth-evidence/summary.json',JSON.stringify({commit:process.env.GITHUB_SHA,checks},null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,`## Growth readiness\n\n${checks.map(c=>`- ${c.status}: ${c.name}`).join('\n')}\n\nThese are automated code/build checks, not authenticated production load testing.\n`);
          if(checks.some(c=>c.status!=='passed'))process.exitCode=1;
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-evidence-${{ github.run_id }}
          path: growth-evidence/
          retention-days: 14
