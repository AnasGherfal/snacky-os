name: Validate product planning buy list

on:
  pull_request:
    branches:
      - master
    paths:
      - "scripts/agent-add-product-buy-list.py"
      - ".github/workflows/agent-add-product-buy-list.yml"

permissions:
  contents: write

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-product-buy-list
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply product buy-list patch
        run: python scripts/agent-add-product-buy-list.py
      - name: Install dependencies
        run: npm ci
      - name: Test product planning and packaging
        run: node --experimental-strip-types --loader ./scripts/ts-alias-loader.mjs --test scripts/test-product-planning-packaging.mjs
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/add-product-buy-list
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          files = [
              "src/app/product-planning/page.tsx",
              "src/app/product-planning/BuyListLiveSummary.tsx",
              "scripts/test-product-planning-packaging.mjs",
          ]

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )
              with urlopen(request) as response:
                  return json.load(response)

          for path in files:
              local = Path(path)
              current_url = f"https://api.github.com/repos/{repository}/contents/{path}?ref={branch}"
              try:
                  current = request_json(current_url)
                  sha = current["sha"]
              except Exception:
                  sha = None
              payload = {
                  "message": "Add persistent product buy list and cost estimate",
                  "content": base64.b64encode(local.read_bytes()).decode(),
                  "branch": branch,
              }
              if sha:
                  payload["sha"] = sha
              request_json(
                  f"https://api.github.com/repos/{repository}/contents/{path}",
                  method="PUT",
                  payload=payload,
              )
          PY
