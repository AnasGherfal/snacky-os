name: Smart Work Part 3E - controlled pilot rollout
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/smart-work-pilot-rollout.yml'
      - 'src/lib/smart-work-start-trip-server.ts'
      - 'src/app/operator/product-plan/**'
      - 'scripts/smart-work-start-trip-fixture.sql'
      - 'scripts/test-smart-work-pilot-scope.sql'
      - 'scripts/test-smart-work-start-trip-api.mjs'
      - 'supabase/feature-sql/smart_work_dispatch_pilot_scope.sql'
      - 'supabase/migrations/*_smart_work_dispatch_pilot_scope.sql'
permissions:
  contents: read
concurrency:
  group: smart-work-pilot-rollout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: smart_pilot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_ci_only
      PGDATABASE: smart_pilot_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate canonical pilot migration
        run: |
          set -euo pipefail
          if ! ls supabase/migrations/*_smart_work_dispatch_pilot_scope.sql >/dev/null 2>&1; then
            supabase migration new smart_work_dispatch_pilot_scope
            file="$(find supabase/migrations -name '*_smart_work_dispatch_pilot_scope.sql' | head -1)"
            cp supabase/feature-sql/smart_work_dispatch_pilot_scope.sql "$file"
          fi
          file="$(find supabase/migrations -name '*_smart_work_dispatch_pilot_scope.sql' | head -1)"
          cmp supabase/feature-sql/smart_work_dispatch_pilot_scope.sql "$file"
          echo "MIGRATION_FILE=$file" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: smart-work-pilot-migration
          path: supabase/migrations/*_smart_work_dispatch_pilot_scope.sql
          retention-days: 3
      - name: Baseline atomic Start Trip regression
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f scripts/smart-work-start-trip-fixture.sql
          psql -v ON_ERROR_STOP=1 -f scripts/smart-work-start-trip-source-fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_start_trip.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-start-trip.sql
      - name: Pilot scope and shortage-safe partial transaction tests
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_day_availability_start_trip.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f supabase/feature-sql/smart_work_dispatch_pilot_scope.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-smart-work-pilot-scope.sql
      - name: Separate-session reservation regression
        run: bash scripts/test-smart-work-start-trip-race.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start Trip API/UI and planner regression
        run: node --experimental-strip-types --experimental-vm-modules --test scripts/test-smart-work-product-plan.mjs scripts/test-smart-work-products-api.mjs scripts/test-smart-work-start-trip-api.mjs
      - name: Full type check
        run: npx tsc --noEmit
