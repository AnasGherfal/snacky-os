name: CRM collaboration release checks
on:
  push:
    branches: ['feat/crm-notes-labels-v1']
  pull_request:
    paths:
      - 'src/**'
      - 'supabase/migrations/*crm_notes_labels*'
      - 'scripts/*crm-collab*'
      - 'scripts/test-crm-collaboration-db.sql'
      - '.github/workflows/crm-collaboration-check.yml'
permissions:
  contents: read
concurrency:
  group: crm-collaboration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-crm-only
          POSTGRES_DB: crm_tests
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-crm-only
      PGDATABASE: crm_tests
    steps:
      - uses: actions/checkout@v4
      - name: Native CRM, notes, labels and buying boundary
        run: |
          set -o pipefail
          psql -X -v ON_ERROR_STOP=1 -f scripts/test-crm-collaboration-db.sql 2>&1 | tee crm-collaboration-db.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-collaboration-db
          path: crm-collaboration-db.log
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: New API and existing CRM/buying/access contracts
        run: node --experimental-strip-types --test scripts/test-crm-collaboration.mjs scripts/test-crm-lead-focus.mjs scripts/test-crm-lead-table.mjs scripts/test-shared-buying.mjs scripts/test-authz-permissions.mjs scripts/test-connected-relations.mjs
      - name: TypeScript and lint
        run: |
          npm run typecheck
          npx eslint src/lib/crm-collaboration.ts src/app/api/crm/collaboration/route.ts src/app/my-work/notes/page.tsx src/components/useCrmCollaborationCommand.ts src/components/CrmManagementNotes.tsx src/components/CrmLeadLabels.tsx src/components/CrmNotesSummary.tsx src/components/CrmLeadsWorkspace.tsx src/components/CrmLeadTable.tsx src/components/CrmLeadFocusList.tsx
      - run: npm run test:critical-workflows
      - name: Final production build without fixtures
        run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare isolated component browser checks
        run: |
          npm install --prefix .qa/crm-browser --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
          .qa/crm-browser/node_modules/.bin/playwright install --with-deps chromium
          mkdir -p src/app/login/qa-crm-collaboration
          cat > src/app/login/qa-crm-collaboration/page.tsx <<'EOF'
          import {CrmManagementNotes} from '@/components/CrmManagementNotes';
          import {CrmLeadLabels} from '@/components/CrmLeadLabels';
          export default async function Page({searchParams}:{searchParams:Promise<Record<string,string>>}){
            const p=await searchParams,ar=p.lang==='ar',id=p.role==='owner'?'11111111-1111-4111-8111-111111111111':'22222222-2222-4222-8222-222222222222';
            return <main id="crm-collab-fixture" className="mx-auto max-w-4xl space-y-8 p-4" dir={ar?'rtl':'ltr'}><CrmManagementNotes key={id+':'+ar} userId={id} ar={ar}/><section className="rounded-xl border bg-white p-4"><h2>{ar?'جهة تجريبية':'Fixture lead'}</h2><CrmLeadLabels key={id+':label:'+ar} leadId="60000000-0000-4000-8000-000000000041" ar={ar}/></section></main>;
          }
          EOF
          node scripts/next-build.mjs
      - name: Actual notes/labels mobile UI and lost-response recovery
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3000 > .qa/crm-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/login/qa-crm-collaboration >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat .qa/crm-server.log; exit 1; fi
            sleep 1
          done
          node scripts/crm-collaboration-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crm-collaboration-mobile
          path: |
            .qa/crm-evidence/**
            .qa/crm-server.log
