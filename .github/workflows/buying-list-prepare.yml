name: Prepare shared buying-list review
on:
  push:
    branches: [feat/shared-buying-lists]
    paths: [.github/workflows/buying-list-prepare.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration identity and exact reviewed source
        run: |
          mkdir -p diagnostics
          supabase --version
          supabase migration new --help
          supabase migration new shared_buying_lists
          cp supabase/migrations/*_shared_buying_lists.sql diagnostics/
          git archive --format=tar.gz -o diagnostics/source.tar.gz HEAD src public scripts supabase .github docs package.json package-lock.json tsconfig.json next.config.ts postcss.config.mjs eslint.config.mjs
          curl --fail --max-time 20 https://supabase.com/changelog.md -o diagnostics/supabase-changelog.md
      - run: npm ci
      - name: Offline local verification dependencies (no credentials)
        run: tar -czf diagnostics/dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: buying-list-review-source
          path: diagnostics/*
          retention-days: 2
