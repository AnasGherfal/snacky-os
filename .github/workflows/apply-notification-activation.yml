name: Apply notification activation integration

on:
  push:
    branches:
      - feature/activate-push-notifications
    paths:
      - "scripts/apply-notification-activation.py"
      - ".github/workflows/apply-notification-activation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-notification-activation.py"
      - ".github/workflows/apply-notification-activation.yml"
      - "src/app/api/push-config/route.ts"
      - "src/app/api/notifications/test/route.ts"
      - "supabase/migrations/202607180002_notification_push_activation.sql"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/activate-push-notifications
      - name: Make integration marker line-based
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-notification-activation.py")
          source = path.read_text(encoding="utf-8")
          start = source.index('source = replace_once(\n    source,\n    "  routeId: string;')
          end = source.index('start = source.index("let vapidConfigured = false;")')
          replacement = '''source = replace_once(source, "  routeId: string;", "  routeId?: string | null;", "notification route id")
          source = replace_once(source, "  routeDate: string;", "  routeDate?: string | null;", "notification route date")
          source = replace_once(source, "  assignedBy: string | null;", "  assignedBy?: string | null;", "notification assigned by")
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding="utf-8")
          PY
      - name: Apply guarded integration and capture diagnostics
        run: |
          set +e
          python scripts/apply-notification-activation.py > /tmp/notification-integration.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cp /tmp/notification-integration.log notification-integration-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add notification-integration-error.txt
            git commit -m "Capture notification integration error"
            git push origin HEAD:feature/activate-push-notifications
            exit "$status"
          fi
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notification-delivery.ts src/components/NotificationCenter.tsx src/components/Topbar.tsx .env.example
          git diff --cached --quiet || git commit -m "Activate self-configuring push notifications"
          git push origin HEAD:feature/activate-push-notifications
