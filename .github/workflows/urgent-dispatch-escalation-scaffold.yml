name: Urgent dispatch escalation migration scaffold
on:
  push:
    branches: ['feat/urgent-dispatch-escalation-v1']
    paths: ['.github/workflows/urgent-dispatch-escalation-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/urgent-dispatch-escalation-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate migration identity only
        run: |
          supabase --version
          supabase migration new urgent_dispatch_escalation_v1
          rm .github/workflows/urgent-dispatch-escalation-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*urgent_dispatch_escalation_v1.sql .github/workflows/urgent-dispatch-escalation-scaffold.yml
          git commit -m 'chore(notifications): add CLI-generated escalation migration scaffold'
          git push origin HEAD:refs/heads/feat/urgent-dispatch-escalation-v1
