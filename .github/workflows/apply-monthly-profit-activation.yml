name: Apply monthly profit activation integration

on:
  push:
    branches:
      - fix/monthly-profit-batch-activation
    paths:
      - "scripts/apply-monthly-profit-activation.py"
      - ".github/workflows/apply-monthly-profit-activation.yml"
  pull_request:
    branches:
      - master
    paths:
      - "scripts/apply-monthly-profit-activation.py"
      - ".github/workflows/apply-monthly-profit-activation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/monthly-profit-batch-activation
          fetch-depth: 0
      - name: Apply activation integration
        run: python scripts/apply-monthly-profit-activation.py
      - name: Validate generated diff
        run: git diff --check
      - name: Commit generated source changes
        run: |
          if git diff --quiet -- src/lib/vms-import-actions.ts src/app/vms-import/[batchId]/page.tsx; then
            echo "Source integration already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/vms-import-actions.ts src/app/vms-import/[batchId]/page.tsx
          git commit -m "Repair Monthly Product Profit activation"
          git push origin HEAD:fix/monthly-profit-batch-activation
