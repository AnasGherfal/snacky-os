name: CRM restored form accessibility
on:
  push:
    branches: ['feat/crm-notes-labels-v1']
    paths: ['.github/workflows/crm-form-label-polish.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Stabilize accessible form names
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/CrmManagementNotes.tsx');s=p.read_text()
          edits=[
            ('<textarea value={draft}', '<textarea aria-label={tr(\'New note\',\'ملاحظة جديدة\')} dir="auto" value={draft}'),
            ('<textarea rows={2} maxLength={4000}', '<textarea aria-label={ar?\'الرد\':\'Reply\'} dir="auto" rows={2} maxLength={4000}'),
            ('<select value={status}', '<select aria-label={ar?\'الحالة\':\'Status\'} value={status}')
          ]
          for a,b in edits:
            if s.count(a)!=1:raise RuntimeError('Note form anchor moved: '+a)
            s=s.replace(a,b)
          p.write_text(s)
          p=Path('src/components/CrmLeadLabels.tsx');s=p.read_text()
          edits=[
            ('<input value={search}', '<input aria-label={ar?\'بحث في تصنيفاتي\':\'Search my labels\'} value={search}'),
            ('<select disabled={save.blocked} value={editId}', '<select aria-label={ar?\'التصنيف\':\'Label\'} disabled={save.blocked} value={editId}'),
            ('<input maxLength={40}', '<input aria-label={ar?\'اسم التصنيف\':\'Label name\'} dir="auto" maxLength={40}'),
            ('<select disabled={save.blocked} value={color}', '<select aria-label={ar?\'اللون\':\'Color\'} disabled={save.blocked} value={color}')
          ]
          for a,b in edits:
            if s.count(a)!=1:raise RuntimeError('Label form anchor moved: '+a)
            s=s.replace(a,b)
          p.write_text(s)
          p=Path('src/components/CrmCollaboration.module.css')
          p.write_text(p.read_text()+'\n/* A surrounding Arabic application must not force LTR notes to align right. */\n.workspace .label :is(input,textarea,select),.labelTool .label :is(input,textarea,select){font-weight:400;text-align:start}\n')
          PY
          rm .github/workflows/crm-form-label-polish.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CrmManagementNotes.tsx src/components/CrmLeadLabels.tsx src/components/CrmCollaboration.module.css .github/workflows/crm-form-label-polish.yml
          git commit -m 'fix(crm): retain accessible labels after draft reload and correct input text alignment'
          git push origin HEAD:refs/heads/feat/crm-notes-labels-v1
