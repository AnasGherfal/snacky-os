name: Integrate verified growth fixes
on:
  push:
    branches: [fix/snacky-growth-integrate-20261112]
permissions:
  contents: write
concurrency:
  group: growth-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/snacky-growth-integrate-20261112
          fetch-depth: 1
      - name: Verify exact baseline and apply checked edits
        run: |
          python .growth-integration/apply.py
          python .growth-integration/purchase.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify all regression gates and types without production credentials
        run: |
          mkdir -p integration-evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const names=['audit:performance','test:growth-hardening','test:route-ledger-core','test:authz-permissions','test:finance-ledger','test:restock-priority','test:vms-sales-import','test:vms-import-validation','test:route-workflow','test:cash-removal','test:growth-cash-regression','test:smart-route-planner','test:smart-route-unified-editor','test:xy-stop-quantity-editor','test:xy-live-sales','test:xy-operational-alerts'];
          const scripts=JSON.parse(fs.readFileSync('package.json','utf8')).scripts;
          const checks=[];
          for(const name of names){
            if(!scripts[name]){checks.push({name,status:'failed',reason:'script missing'});continue;}
            const start=Date.now();
            const r=spawnSync('npm',['run',name],{encoding:'utf8',timeout:120000,maxBuffer:16*1024*1024});
            fs.writeFileSync(`integration-evidence/${name.replaceAll(':','_')}.log`,`${r.stdout??''}\n${r.stderr??''}`);
            checks.push({name,status:r.status===0?'passed':'failed',exit_code:r.status,duration_ms:Date.now()-start});
            console.log(name,r.status);
          }
          const t=spawnSync('npx',['tsc','--noEmit'],{encoding:'utf8',timeout:180000,maxBuffer:16*1024*1024});
          fs.writeFileSync('integration-evidence/typescript.log',`${t.stdout??''}\n${t.stderr??''}`);
          checks.push({name:'typescript',status:t.status===0?'passed':'failed',exit_code:t.status});
          fs.writeFileSync('integration-evidence/summary.json',JSON.stringify({source:process.env.GITHUB_SHA,checks},null,2));
          if(checks.some(c=>c.status==='failed'))process.exitCode=1;
          NODE
      - name: Commit only tested source changes to the isolated branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts docs package.json
          git commit -m 'Harden complete reads, cash interval accuracy and operating navigation'
          git push origin HEAD:refs/heads/fix/snacky-growth-integrate-20261112
          git rev-parse HEAD > integration-evidence/candidate-sha.txt
      - name: Save diagnostic source and verification artifacts
        if: always()
        run: |
          mkdir -p integration-evidence
          tar -czf integration-evidence/candidate-source.tar.gz .growth-integration src scripts docs package.json package-lock.json tsconfig.json next.config.ts .github/workflows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-integration-${{ github.run_id }}
          path: integration-evidence/
          retention-days: 7
