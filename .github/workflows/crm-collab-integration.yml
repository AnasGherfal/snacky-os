name: CRM collaboration integration
on:
  push:
    branches: ['feat/crm-notes-labels-v1']
    paths: ['.github/workflows/crm-collab-integration.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source anchors
        run: |
          python3 scripts/apply-crm-collaboration-integration.py
          rm scripts/apply-crm-collaboration-integration.py .github/workflows/crm-collab-integration.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/test-shared-buying.mjs scripts/apply-crm-collaboration-integration.py supabase/migrations/20260927123856_crm_notes_labels_v1.sql .github/workflows/crm-collab-integration.yml
          git commit -m 'feat(crm): integrate management notes and personal label tools; remove CRM-only buying access'
          git push origin HEAD:refs/heads/feat/crm-notes-labels-v1
          git archive --format=tar HEAD > /tmp/crm-integrated-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: crm-integrated-source
          path: /tmp/crm-integrated-source.tar
          retention-days: 7
