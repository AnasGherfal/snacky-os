name: Refresh Next lockfile

on:
  push:
    branches:
      - simplify-operator-buying-and-cash-nav
    paths:
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Next to patched version
        run: npm install --package-lock-only --ignore-scripts --no-audit next@16.3.8
      - uses: actions/upload-artifact@v4
        with:
          name: patched-next-lockfile
          path: |
            package.json
            package-lock.json
          retention-days: 1
