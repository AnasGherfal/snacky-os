name: Refresh Next lockfile

on:
  push:
    branches:
      - simplify-operator-buying-and-cash-nav
    paths:
      - .github/workflows/refresh-next-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: simplify-operator-buying-and-cash-nav
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update Next to patched version
        run: npm install --package-lock-only --ignore-scripts --no-audit next@16.3.8
      - name: Commit patched dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: update Next to 16.3.8"
          git push origin HEAD:simplify-operator-buying-and-cash-nav
