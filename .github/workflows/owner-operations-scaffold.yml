name: Owner operations migration scaffold
on:
  push:
    branches: ['feat/owner-operations-overview-v1']
    paths: ['.github/workflows/owner-operations-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/owner-operations-overview-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Create migration with CLI
        run: |
          supabase --version
          supabase migration new --help
          supabase migration new owner_operations_overview_v1
          rm .github/workflows/owner-operations-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*owner_operations_overview_v1.sql .github/workflows/owner-operations-scaffold.yml
          git commit -m 'chore(operations): add CLI-generated overview migration scaffold'
          git push origin HEAD:refs/heads/feat/owner-operations-overview-v1
