name: Cash handover isolated acceptance
on:
  pull_request:
    paths:
      - 'src/lib/cash-handover.ts'
      - 'src/lib/cash-photo.ts'
      - 'src/lib/authz.ts'
      - 'src/components/CashHandlingWorkspace*'
      - 'src/components/Sidebar.tsx'
      - 'src/app/api/cash-handling/**'
      - 'src/app/cash-handling/**'
      - 'src/app/cash-collections/layout.tsx'
      - 'supabase/migrations/*cash_handover_coordinator*'
      - 'scripts/*cash-handover*'
      - '.github/workflows/cash-handover-check.yml'
permissions:
  contents: read
concurrency:
  group: cash-handover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Prepare disposable backend, never a production link
        run: |
          mkdir -p .qa/full/supabase diagnostics
          python3 - <<'PY'
          from pathlib import Path
          text=Path('supabase/config.toml').read_text().replace('project_id = "snacky-os"','project_id = "snacky-company-isolated"')
          for section in ['db.migrations','db.seed','studio','inbucket','realtime','edge_runtime']:
            start=text.index('['+section+']'); end=text.find('\n[',start+1)
            if end<0:end=len(text)
            text=text[:start]+text[start:end].replace('enabled = true','enabled = false')+text[end:]
          Path('.qa/full/supabase/config.toml').write_text(text)
          PY
      - name: Real local Auth, REST, Storage and PostgreSQL
        run: |
          supabase start --workdir .qa/full > diagnostics/local-start.log 2>&1 || { tail -n 80 diagnostics/local-start.log; exit 1; }
          supabase status --workdir .qa/full -o env > .qa/local-status.env
      - name: Replay original migrations and the new opt-in migration
        run: python3 scripts/company-e2e/migrate.py
      - name: Install pinned app and isolated browser tools
        run: |
          npm ci
          npm install --prefix .qa/browser --no-package-lock --ignore-scripts playwright@1.55.0 @axe-core/playwright@4.10.2
          .qa/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Types and focused lint
        run: |
          npm run typecheck
          npx eslint src/lib/cash-handover.ts src/lib/cash-photo.ts src/components/CashHandlingWorkspace.tsx src/app/api/cash-handling/route.ts src/app/cash-handling/page.tsx src/app/cash-collections/layout.tsx
      - name: New contracts and existing critical cash / route checks
        run: |
          node --experimental-strip-types --test scripts/test-cash-handover.mjs
          npm run test:cash-removal
          npm run test:authz-permissions
          npm run test:critical-workflows
      - name: Real cash lifecycle, production build and Arabic / English browser acceptance
        run: node scripts/cash-handover-e2e.mjs
      - name: Redact local-only keys from diagnostic logs
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in Path('diagnostics').rglob('*.log'):
            text=p.read_text(errors='replace')
            text=re.sub(r'eyJ[A-Za-z0-9_\-.]+','[LOCAL_JWT_REDACTED]',text)
            text=re.sub(r'sb_(?:secret|publishable)_[A-Za-z0-9_-]+','[LOCAL_KEY_REDACTED]',text)
            p.write_text(text)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cash-handover-acceptance
          path: diagnostics/
          retention-days: 7
      - name: Destroy disposable backend
        if: always()
        run: supabase stop --workdir .qa/full --no-backup || true
