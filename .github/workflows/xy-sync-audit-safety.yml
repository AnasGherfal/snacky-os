name: XY sync routine audit write reduction safety
on:
  pull_request:
    paths:
      - 'src/lib/xy-vms-sync.ts'
      - 'src/lib/xy-vms-activity-policy.ts'
      - 'scripts/test-xy-vms-activity-policy.mjs'
      - '.github/workflows/xy-sync-audit-safety.yml'
permissions:
  contents: read
concurrency:
  group: xy-sync-audit-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Assert routine cron dedupe never suppresses warnings, errors or manual activity
        run: node --experimental-strip-types --test scripts/test-xy-vms-activity-policy.mjs
