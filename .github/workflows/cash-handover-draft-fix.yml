name: Cash draft source correction
on:
  push:
    branches: ['feat/cash-handover-coordinator-v1']
    paths: ['.github/workflows/cash-handover-draft-fix.yml']
permissions:
  contents: write
jobs:
  correct:
    if: github.ref == 'refs/heads/feat/cash-handover-coordinator-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cash-handover-coordinator-v1
      - name: Apply exact draft corrections, never a database change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/authz.ts'); s=p.read_text(); assert s.count('"vms_import_confirm"')==1
          p.write_text(s.replace('"vms_import_confirm"','"vms_import.confirm"'))
          p=Path('supabase/migrations/20260923120059_cash_handover_coordinator_v1.sql'); s=p.read_text()
          for a,b in [
            ('declare p jsonb; a text; k text; allowed text[];','declare p jsonb; a text; v_key text; allowed text[];'),
            ('foreach k in array allowed loop','foreach v_key in array allowed loop'),
            ("if k<>'enabled' and jsonb_typeof(p->k) is distinct from 'string' then","if v_key<>'enabled' and jsonb_typeof(p->v_key) is distinct from 'string' then")]:
            assert s.count(a)==1,a
            s=s.replace(a,b)
          p.write_text(s)
          Path('.github/workflows/cash-handover-draft-fix.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/authz.ts supabase/migrations/20260923120059_cash_handover_coordinator_v1.sql .github/workflows/cash-handover-draft-fix.yml
          git commit -m 'fix(cash): disambiguate SQL field validation and preserve VMS permission'
          git push origin HEAD:refs/heads/feat/cash-handover-coordinator-v1
