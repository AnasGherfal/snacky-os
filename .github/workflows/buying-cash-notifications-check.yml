name: Buying and cash notification checks
on:
  push:
    branches: ['feat/buying-cash-notifications-v1']
  pull_request:
    paths:
      - 'supabase/migrations/*buying_cash_notifications*'
      - 'scripts/prepare-buying-cash-notice-db.py'
      - 'scripts/push-tests/buying-cash-notifications.sql'
      - 'scripts/test-buying-cash-notifications.mjs'
      - '.github/workflows/buying-cash-notifications-check.yml'
permissions:
  contents: read
concurrency:
  group: buying-cash-notices-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notification_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notification_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Event contracts and existing notification regressions
        run: node --test scripts/test-buying-cash-notifications.mjs scripts/test-assignment-notifications.mjs scripts/test-urgent-dispatch-escalation.mjs
      - name: Isolated database and original notification eligibility
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260919170000_push_notification_activation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/assignments-bootstrap.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260919220000_assignment_notifications.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'alter table public.crm_tasks add column dispatch_state text, add column ack_due_at timestamptz;'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260924154410_urgent_dispatch_escalation_v1.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260926104649_escalation_assignment_generation_v1.sql
          python3 scripts/prepare-buying-cash-notice-db.py
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/.buying-cash-notice-fixture.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20260926153924_buying_cash_notifications_v1.sql
      - name: Buying and cash event behavior, privacy and failure isolation
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/buying-cash-notifications.sql 2>&1 | tee buying-cash-acceptance.log
      - name: Existing assignment and escalation behavior after extension
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/assignments.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/urgent-dispatch-escalation.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/push-tests/escalation-generation.sql
      - name: TypeScript and existing critical workflows
        run: |
          npm run typecheck
          npm run test:critical-workflows
      - name: Production build
        run: npm run build
      - name: Save verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buying-cash-notification-acceptance
          path: buying-cash-acceptance.log
