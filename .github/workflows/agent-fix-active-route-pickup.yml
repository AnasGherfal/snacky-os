name: Validate active route pickup quantity repair

on:
  push:
    branches:
      - agent/fix-active-route-pickup-quantity

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-active-route-pickup-quantity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply active route pickup repair
        run: python scripts/agent-fix-active-route-pickup.py
      - name: Install dependencies
        run: npm ci
      - name: Test active route pickup quantity
        run: node --test scripts/test-active-route-pickup-quantity.mjs
      - name: Test route pickup checklist
        run: npm run test:route-pickup-checklist
      - name: Test route inventory regression
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/operator/routes/[id]/pick-list/route.ts scripts/test-active-route-pickup-quantity.mjs
          git diff --cached --quiet || git commit -m "Fix pickup quantities after route start"
          git push origin HEAD:agent/fix-active-route-pickup-quantity
