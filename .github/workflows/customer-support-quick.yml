name: Customer support quick issue checks
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/components/CrmRecordForms.tsx'
      - 'src/components/CrmWorkspace.tsx'
      - 'src/components/CompanyHub.tsx'
      - 'src/app/company/profile/page.tsx'
      - 'supabase/migrations/20260921173500_customer_support_compensation_limit.sql'
      - 'scripts/test-customer-support-quick.mjs'
      - '.github/workflows/customer-support-quick.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test customer support quick flow
        run: node --test scripts/test-customer-support-quick.mjs
      - name: Critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
