name: Check XY diagnostic credential availability

on:
  push:
    branches:
      - diagnose-xy-write-swagger
    paths:
      - .github/workflows/check-xy-diagnostic-secrets.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      XY_VMS_MERCHANT_ID: ${{ secrets.XY_VMS_MERCHANT_ID }}
      XY_VMS_KEY: ${{ secrets.XY_VMS_KEY }}
      XY_VMS_SECRET: ${{ secrets.XY_VMS_SECRET }}
      XY_VMS_BASE_URL: ${{ secrets.XY_VMS_BASE_URL }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          for name in XY_VMS_MERCHANT_ID XY_VMS_KEY XY_VMS_SECRET XY_VMS_BASE_URL; do
            if [ -n "${!name:-}" ]; then echo "$name=present"; else echo "$name=missing"; fi
          done
