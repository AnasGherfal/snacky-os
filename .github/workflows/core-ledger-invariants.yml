name: Core ledger invariants

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: core-ledger-invariants-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test core route ledger contracts
        run: npm run test:route-ledger-core
      - name: Typecheck Snacky OS
        run: npm run typecheck
      - name: Build Snacky OS
        run: npm run build
