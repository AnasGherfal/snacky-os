name: CRM notes labels scaffold
on:
  push:
    branches: ['feat/crm-notes-labels-v1']
    paths: ['.github/workflows/crm-notes-labels-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - name: Generate identity and review source
        run: |
          supabase migration new --help
          supabase migration new crm_notes_labels_v1
          rm .github/workflows/crm-notes-labels-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/*crm_notes_labels_v1.sql .github/workflows/crm-notes-labels-scaffold.yml
          git commit -m 'chore(crm): add CLI-generated notes labels migration scaffold'
          git push origin HEAD:refs/heads/feat/crm-notes-labels-v1
          git archive --format=tar HEAD > /tmp/crm-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: crm-reviewed-source
          path: /tmp/crm-source.tar
          retention-days: 7
