name: Saved XY cash visibility and persistence
on:
  pull_request:
    paths:
      - 'src/lib/cash-vms-window.ts'
      - 'src/lib/cash-vms-manual-actions.ts'
      - 'src/app/cash-collections/compare/page.tsx'
      - 'src/app/cash-collections/page.tsx'
      - 'src/app/cash-collections/[id]/page.tsx'
      - 'src/app/cash-collections/action-queue/page.tsx'
      - 'scripts/test-saved-xy-vms-cash-visible.mjs'
      - '.github/workflows/saved-xy-cash-visibility-check.yml'
permissions:
  contents: read
jobs:
  saved-xy-cash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Persisted visibility, exact-period, and cash queue tests
        run: |
          node --experimental-strip-types --test scripts/test-saved-xy-vms-cash-visible.mjs
          node --experimental-strip-types --test scripts/test-cash-vms-window.mjs
          node --test scripts/test-cash-action-queue.mjs
      - name: Full application type check
        run: npm run typecheck
      - name: Lint new/clean files
        run: npx eslint src/lib/cash-vms-window.ts src/lib/cash-vms-manual-actions.ts src/app/cash-collections/compare/page.tsx
