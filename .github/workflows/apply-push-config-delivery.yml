name: Apply self-configuring push delivery

on:
  push:
    branches:
      - feature/self-configuring-push
    paths:
      - "scripts/apply-push-config-delivery.py"
      - ".github/workflows/apply-push-config-delivery.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/self-configuring-push
      - name: Apply guarded delivery integration
        run: python scripts/apply-push-config-delivery.py
      - name: Commit delivery integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/notification-delivery.ts
          git diff --cached --quiet || git commit -m "Use self-configured keys for route notifications"
          git push origin HEAD:feature/self-configuring-push
