name: Apply per-stop pickup state fix once
on:
  push:
    branches: [fix/operator-pickup-checklist]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/operator-pickup-checklist
          fetch-depth: 0
      - run: node scripts/apply-per-stop-pickup-state-fix.cjs
      - name: Commit source repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'src/app/api/operator/routes/[id]/pick-list/route.ts'
          git commit -m 'Keep pending stops pickable after earlier pickup'
          git push
