name: Apply growth VMS RPC fix

on:
  push:
    branches:
      - agent/use-sales-dashboard-rpcs-for-growth
    paths:
      - ".github/workflows/agent-apply-growth-vms-rpc-fix.yml"
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/agent-apply-growth-vms-rpc-fix.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/use-sales-dashboard-rpcs-for-growth
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply prepared files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_BLOB_SHA: 0d7a783028a9adfdb2567b9cd306419e48caaf1e
          TEST_BLOB_SHA: dcfbe03165dddfee9e344c6e10cf87362d2cd417
        run: |
          python - <<'PY'
          import base64
          import gzip
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          def load_blob(sha):
              request = Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request) as response:
                  payload = json.load(response)
              compressed = base64.b64decode(payload["content"])
              return gzip.decompress(compressed)

          files = {
              "src/app/finance/growth-decisions/page.tsx": os.environ["PAGE_BLOB_SHA"],
              "scripts/test-growth-investor-portal.mjs": os.environ["TEST_BLOB_SHA"],
          }
          for path, sha in files.items():
              destination = Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(load_blob(sha))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Test growth and investor portal
        run: node --experimental-strip-types --test scripts/test-growth-investor-portal.mjs
      - name: Test route pickup
        run: npm run test:route-pickup-checklist
      - name: Test route inventory
        run: npm run test:route-inventory-regression
      - name: Test critical workflows
        run: npm run test:critical-workflows
      - name: Build Snacky OS
        run: npm run build
      - name: Publish validated source files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: agent/use-sales-dashboard-rpcs-for-growth
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GITHUB_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def update_file(path, message):
              encoded_path = quote(path, safe="/")
              encoded_branch = quote(branch, safe="")
              metadata_request = Request(
                  f"https://api.github.com/repos/{repository}/contents/{encoded_path}?ref={encoded_branch}",
                  headers=headers,
              )
              with urlopen(metadata_request) as response:
                  current = json.load(response)
              payload = json.dumps({
                  "message": message,
                  "content": base64.b64encode(Path(path).read_bytes()).decode("ascii"),
                  "sha": current["sha"],
                  "branch": branch,
              }).encode("utf-8")
              update_request = Request(
                  f"https://api.github.com/repos/{repository}/contents/{encoded_path}",
                  data=payload,
                  headers={**headers, "Content-Type": "application/json"},
                  method="PUT",
              )
              with urlopen(update_request) as response:
                  result = json.load(response)
              print(path, result["commit"]["sha"])

          update_file(
              "src/app/finance/growth-decisions/page.tsx",
              "Use sales dashboard RPCs for growth decisions",
          )
          update_file(
              "scripts/test-growth-investor-portal.mjs",
              "Test growth dashboard RPC sales sources",
          )
          PY
