name: Escalation generation migration scaffold
on:
  push:
    branches: ['fix/escalation-assignment-generation-v1']
    paths: ['.github/workflows/escalation-generation-scaffold.yml']
permissions:
  contents: write
jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/escalation-assignment-generation-v1
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: |
          supabase migration new --help
          supabase migration new escalation_assignment_generation_v1
          target=$(find supabase/migrations -name '*_escalation_assignment_generation_v1.sql')
          test -n "$target"
          cp scripts/escalation-generation-patch.sql "$target"
          rm scripts/escalation-generation-patch.sql .github/workflows/escalation-generation-scaffold.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target" scripts/escalation-generation-patch.sql .github/workflows/escalation-generation-scaffold.yml
          git commit -m 'fix(notifications): add CLI-generated escalation generation migration'
          git push origin HEAD:refs/heads/fix/escalation-assignment-generation-v1
